<meta name="format-detection" content="telephone=no">
<title>180</title>
<style>
:root{
  --bg:#0A0B0C;
  --surface:#121416;
  --surface-2:#181B1E;
  --surface-3:#1F2327;
  --line:#282D32;
  --line-soft:#1E2226;
  --text:#E9EBED;
  --text-2:#A7AEB5;
  --muted:#6E767E;
  --accent:#E23A2E;
  --accent-hi:#FF5546;
  --accent-dim:#3A1613;
  --good:#3FA95B;
  --warn:#C9962F;
  --bad:#C4453C;
  --r:4px;
  --font:Arial, "Helvetica Neue", Helvetica, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:15px;
  line-height:1.45;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:var(--font);font-size:15px;color:var(--text);}
button{cursor:pointer;border:none;background:none;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;}
.tnum{font-variant-numeric:tabular-nums;}

/* shell */
.shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.view{flex:1;padding:20px 18px 26px;display:flex;flex-direction:column;gap:18px;}
.view.pad-nav{padding-bottom:96px;}

/* type */
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0;}
h1{font-size:26px;font-weight:bold;letter-spacing:-.01em;margin:0;text-wrap:balance;}
h2{font-size:17px;font-weight:bold;margin:0;letter-spacing:-.005em;}
h3{font-size:13px;font-weight:bold;margin:0;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);}
p{margin:0;}
.lede{color:var(--text-2);font-size:14px;max-width:60ch;}
.small{font-size:12.5px;color:var(--muted);}
.err{font-size:13px;color:#E88880;background:var(--accent-dim);border-left:2px solid var(--bad);padding:9px 11px;}
.ok-msg{font-size:13px;color:#8FCF9F;border-left:2px solid var(--good);padding:9px 11px;background:#12211610;}

/* brand */
.brand{display:flex;align-items:center;gap:11px;}
.mark{width:38px;height:38px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;letter-spacing:-.03em;flex:0 0 auto;}
.mark.sm{width:28px;height:28px;font-size:11px;}
.brand-name{font-size:19px;font-weight:bold;letter-spacing:.02em;}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line-soft);padding:16px;display:flex;flex-direction:column;gap:12px;}
.card.tight{padding:13px;gap:9px;}
.stack{display:flex;flex-direction:column;gap:12px;}
.stack.sm{gap:8px;}
.row{display:flex;gap:9px;}
.row > *{flex:1;}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.rule{height:1px;background:var(--line-soft);}

/* form */
label.fl{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
input[type=text],input[type=email],input[type=password],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;color:var(--text);
}
textarea{resize:vertical;min-height:70px;line-height:1.4;}
input::placeholder,textarea::placeholder{color:#565E66;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:var(--r);font-weight:bold;font-size:14.5px;letter-spacing:.01em;transition:background .12s ease,border-color .12s ease;}
.btn-p{background:var(--accent);color:#fff;}
.btn-p:hover{background:var(--accent-hi);}
.btn-p:disabled{background:var(--surface-3);color:var(--muted);cursor:not-allowed;}
.btn-s{background:var(--surface-2);border:1px solid var(--line);color:var(--text);}
.btn-s:hover{border-color:var(--muted);}
.btn-s:disabled{color:var(--muted);cursor:not-allowed;}
.btn-q{background:none;color:var(--text-2);font-weight:normal;padding:9px 6px;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;}
.btn-q:hover{color:var(--text);}
.btn.wide{width:100%;}
.btn.sm{padding:9px 12px;font-size:13px;}
.btn-danger{background:none;border:1px solid #4A2622;color:#E08078;}

/* menu tiles */
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line-soft);padding:15px;transition:border-color .12s ease,background .12s ease;}
.tile:hover{border-color:var(--line);background:var(--surface-2);}
.tile.primary{border-color:#3A2320;background:linear-gradient(180deg,#1A1412,var(--surface));}
.tile .ti{width:34px;height:34px;flex:0 0 auto;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:bold;font-size:12px;letter-spacing:-.02em;}
.tile.primary .ti{background:var(--accent);border-color:var(--accent);color:#fff;}
.tile .tt{font-weight:bold;font-size:15px;display:block;}
.tile .td{font-size:12.5px;color:var(--muted);margin-top:2px;display:block;}
.tile .tc{margin-left:auto;color:var(--muted);font-size:18px;}

/* avatar */
.av{border-radius:50%;background:var(--surface-3);border:1px solid var(--line);object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:bold;color:var(--text-2);flex:0 0 auto;overflow:hidden;}
.av-32{width:32px;height:32px;font-size:12px;}
.av-40{width:40px;height:40px;font-size:14px;}
.av-72{width:72px;height:72px;font-size:24px;}
img.av{display:block;}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:#0E0F11;border-top:1px solid var(--line-soft);}
.nav-in{max-width:480px;margin:0 auto;display:flex;}
.nav button{flex:1;padding:12px 0 16px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.nav button .ni{width:18px;height:18px;border:1.5px solid currentColor;}
.nav button .ni.circle{border-radius:50%;}
.nav button .ni.feed{border:none;display:flex;flex-direction:column;justify-content:space-between;}
.nav button .ni.feed i{display:block;height:2px;background:currentColor;}
.nav button.on{color:var(--accent);}

/* scoreboard */
.sb{display:grid;gap:8px;}
.sb.c2{grid-template-columns:1fr 1fr;}
.sb.c3{grid-template-columns:1fr 1fr 1fr;}
.sb.c4{grid-template-columns:1fr 1fr;}
.ptile{background:var(--surface);border:1px solid var(--line-soft);padding:12px 12px 11px;position:relative;}
.ptile.act{border-color:var(--accent);background:linear-gradient(180deg,#171210,var(--surface));}
.ptile .pn{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.ptile.act .pn{color:var(--text);}
.ptile .ps{font-size:36px;font-weight:bold;line-height:1;letter-spacing:-.03em;}
.sb.c3 .ptile .ps,.sb.c4 .ptile .ps{font-size:30px;}
.ptile .pmeta{font-size:11px;color:var(--muted);margin-top:6px;min-height:15px;}
.ptile .turnbar{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);}
.bot-tag{font-size:9px;letter-spacing:.1em;border:1px solid var(--line);padding:1px 4px;color:var(--muted);text-transform:uppercase;}

/* darts row */
.darts{display:flex;gap:8px;}
.dslot{flex:1;height:52px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:bold;color:var(--muted);background:var(--surface);}
.dslot.on{border-style:solid;border-color:var(--accent);color:var(--text);}
.dslot.zero{border-color:#4A2622;color:var(--muted);}

/* keypad */
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.kp button{padding:12px 0;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);font-size:14px;font-weight:bold;}
.kp button:hover{border-color:var(--line);}
.kp button.wide2{grid-column:span 2;}
.mults{display:flex;gap:6px;}
.mults button{flex:1;padding:10px 0;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);}
.mults button.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:bold;}

/* camera */
.cam{position:relative;background:#000;border:1px solid var(--line);overflow:hidden;}
video{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#000;}
canvas.ov{position:absolute;inset:0;width:100%;height:100%;}
.cam-badge{position:absolute;top:9px;left:9px;display:inline-flex;align-items:center;gap:6px;background:rgba(10,11,12,.85);border:1px solid var(--line);padding:4px 9px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.cam-badge.on{color:var(--good);}
.cam-badge .d{width:6px;height:6px;border-radius:50%;background:currentColor;}
.cam-hint{position:absolute;left:9px;right:9px;bottom:9px;background:rgba(10,11,12,.9);border:1px solid var(--line);padding:8px 10px;font-size:12.5px;line-height:1.35;}
.cam-hint a{color:var(--accent-hi);cursor:pointer;text-decoration:underline;}

/* detect confirm */
.confirm{border:1px solid var(--accent);background:linear-gradient(180deg,#191210,var(--surface));padding:14px;display:flex;flex-direction:column;gap:11px;}
.confirm .cv{font-size:24px;font-weight:bold;letter-spacing:-.02em;}
.confirm .cv em{font-style:normal;color:var(--muted);font-size:14px;font-weight:normal;}

/* log */
.log-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
.log-row:last-child{border-bottom:none;}
.log-row .lp{color:var(--text-2);}
.log-row .lv{font-weight:bold;}
.log-row.bust .lv{color:var(--bad);}

/* feed */
.post{background:var(--surface);border:1px solid var(--line-soft);padding:14px;display:flex;flex-direction:column;gap:11px;}
.post-head{display:flex;align-items:center;gap:10px;}
.post-head .pu{font-weight:bold;font-size:14px;}
.post-head .pt{font-size:11.5px;color:var(--muted);}
.post-body{font-size:14px;color:var(--text-2);}
.result-box{border:1px solid var(--line);background:var(--bg);}
.result-line{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
.result-line:last-child{border-bottom:none;}
.result-line.win{color:var(--text);font-weight:bold;}
.result-line.win .rn::before{content:"";display:inline-block;width:6px;height:6px;background:var(--accent);margin-right:8px;vertical-align:middle;}
.result-line .rn{color:var(--text-2);}
.result-line.win .rn{color:var(--text);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:3px 8px;color:var(--muted);}
.post-actions{display:flex;gap:6px;border-top:1px solid var(--line-soft);padding-top:10px;}
.post-actions button{flex:1;padding:7px 0;font-size:12.5px;color:var(--text-2);border:1px solid transparent;}
.post-actions button:hover{border-color:var(--line);}
.post-actions button.liked{color:var(--accent);font-weight:bold;}
.comment{display:flex;gap:8px;font-size:13px;padding-top:8px;}
.comment b{font-weight:bold;}
.comment span{color:var(--text-2);}
.tabs{display:flex;border:1px solid var(--line-soft);background:var(--surface);}
.tabs button{flex:1;padding:10px 0;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.tabs button.on{background:var(--surface-3);color:var(--text);font-weight:bold;}

/* players setup */
.prow{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line-soft);padding:10px;}
.prow input{flex:1;padding:9px 10px;}
.prow select{width:132px;padding:9px 8px;font-size:13.5px;}
.prow .rm{color:var(--muted);font-size:18px;padding:0 6px;}
.prow .rm:hover{color:var(--bad);}

/* code display */
.code-box{border:1px solid var(--line);background:var(--surface);padding:20px;text-align:center;}
.code-box .cd{font-size:38px;font-weight:bold;letter-spacing:.22em;padding-left:.22em;}
.code-box .cl{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}

/* stats grid */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);}
.stat{background:var(--surface);padding:13px;}
.stat .sv{font-size:22px;font-weight:bold;letter-spacing:-.02em;}
.stat .sl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px;}

/* friends */
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.frow:last-child{border-bottom:none;}
.frow .fn{font-weight:bold;font-size:14px;display:block;}
.frow .fm{font-size:12px;color:var(--muted);display:block;}
.frow .fa{margin-left:auto;}

/* win banner */
.win{border:1px solid var(--accent);background:linear-gradient(180deg,#1B1310,var(--surface));padding:22px;text-align:center;}
.win .wl{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);}
.win .wn{font-size:30px;font-weight:bold;letter-spacing:-.02em;margin-top:6px;}
.win .ws{font-size:13px;color:var(--muted);margin-top:4px;}

.empty{border:1px dashed var(--line);padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px;}
.hidden{display:none !important;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}

/* logo */
.logo-hero{width:172px;height:auto;display:block;}
.logo-head{height:30px;width:auto;display:block;}
.logo-nav{height:19px;width:auto;opacity:.55;}
.nav button.on .logo-nav{opacity:1;}

/* toasts */
.toasts{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));transition:bottom .15s ease;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:60;padding:0 16px;}
.toast{background:var(--surface-3);border:1px solid var(--line);color:var(--text);padding:11px 15px;border-radius:var(--r);font-size:13.5px;max-width:440px;width:100%;
  box-shadow:0 10px 30px rgba(0,0,0,.45);animation:toast-in .18s ease-out;}
.toast.good{border-color:#255C36;}
.toast.bad{border-color:#5A2A26;}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* modale */
.modal-bg{position:fixed;inset:0;background:rgba(6,7,8,.78);display:flex;align-items:center;justify-content:center;padding:24px;z-index:70;}
.modal{background:var(--surface);border:1px solid var(--line);max-width:380px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;}
.modal h2{font-size:17px;}
.modal p{font-size:14px;color:var(--text-2);}

/* bandeau de tour */
.turn-flash{position:fixed;left:0;right:0;top:0;background:var(--accent);color:#fff;text-align:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;font-size:13.5px;font-weight:bold;z-index:65;animation:flash-in .2s ease-out;}
@keyframes flash-in{from{transform:translateY(-100%);}to{transform:none;}}

/* mobile */
html{-webkit-text-size-adjust:100%;}
body{overscroll-behavior-y:none;}
.shell{min-height:100vh;min-height:100dvh;}
button,.tile,.dslot{touch-action:manipulation;}
input[type=text],input[type=email],input[type=password],select,textarea{font-size:16px;}
.view{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:max(18px,env(safe-area-inset-top));}
.view.pad-nav{padding-bottom:calc(104px + env(safe-area-inset-bottom));}
.nav{padding-bottom:env(safe-area-inset-bottom);}
.nav button{min-height:56px;}
.btn{min-height:48px;}
.btn.sm{min-height:42px;}
.btn-q{min-height:40px;}
.kp button{min-height:48px;font-size:15px;}
.mults button{min-height:42px;}
.prow .rm{min-width:34px;min-height:34px;}
.cam-tools{display:flex;gap:8px;}
.cam-tools .btn{flex:1;}
.cam-line{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cam-target{position:absolute;top:9px;right:9px;background:rgba(10,11,12,.85);border:1px solid var(--line);padding:4px 9px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);border:1px solid var(--line);padding:8px 11px;border-radius:var(--r);background:var(--surface-2);min-height:40px;}
.switch.on{border-color:var(--accent);color:var(--text);}
.switch .led{width:8px;height:8px;border-radius:50%;background:var(--muted);}
.switch.on .led{background:var(--good);}
@media (max-width:359px){
  .kp{grid-template-columns:repeat(4,1fr);}
  .ptile .ps{font-size:30px;}
}
@media (min-width:600px){
  .shell{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);}
}
</style>
</head>

   Stockage local (localStorage). Un backend prend le relais
   pour le multi entre appareils.

/* ---------- storage ---------- */
const K = {users:'d180.users', session:'d180.session', feed:'d180.feed', rooms:'d180.rooms', hist:'d180.hist', calib:'d180.calib', camPref:'d180.campref'};
function load(k, d){ try{ const v = localStorage.getItem(k); return v? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,10); }
function now(){ return Date.now(); }

/* ---------- board geometry ---------- */
const SECTORS = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const R_DBULL=0.0374, R_BULL=0.0935, R_TRI_IN=0.582, R_TRI_OUT=0.629, R_DBL_IN=0.953, R_DBL_OUT=1.06;
const CAL_TARGETS = [[0,1],[1,0],[0,-1],[-1,0]];
const CAL_LABELS = ['20, en haut','6, à droite','3, en bas','11, à gauche'];

function solveLinear(A,B){
  const n=B.length, M=A.map((r,i)=>[...r,B[i]]);
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    [M[c],M[p]]=[M[p],M[c]];
    const pv=M[c][c]; if(Math.abs(pv)<1e-9) continue;
    for(let j=c;j<=n;j++) M[c][j]/=pv;
    for(let r=0;r<n;r++){ if(r===c) continue; const f=M[r][c]; if(!f) continue; for(let j=c;j<=n;j++) M[r][j]-=f*M[c][j]; }
  }
  return M.map(r=>r[n]);
}
function solveHomography(src,dst){
  const A=[],B=[];
  for(let i=0;i<4;i++){
    const [x,y]=src[i],[X,Y]=dst[i];
    A.push([x,y,1,0,0,0,-x*X,-y*X]); B.push(X);
    A.push([0,0,0,x,y,1,-x*Y,-y*Y]); B.push(Y);
  }
  const h=solveLinear(A,B);
  return [h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];
}
function applyH(H,x,y){ const d=H[6]*x+H[7]*y+H[8]; return [(H[0]*x+H[1]*y+H[2])/d,(H[3]*x+H[4]*y+H[5])/d]; }
function invH(H){
  const [a,b,c,d,e,f,g,h,i]=H;
  const A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g,D=-(b*i-c*h),E=a*i-c*g,F=-(a*h-b*g),G=b*f-c*e,Hh=-(a*f-c*d),I=a*e-b*d;
  const det=a*A+b*B+c*C;
  return [A/det,D/det,G/det,B/det,E/det,Hh/det,C/det,F/det,I/det];
}

function dartOf(mult,num){
  if(num===0||mult===0) return {value:0,label:'Manqué',mult:0,num:0};
  if(num===25) return mult===2? {value:50,label:'D-BULL',mult:2,num:25} : {value:25,label:'BULL',mult:1,num:25};
  const p = mult===3?'T':mult===2?'D':'S';
  return {value:num*mult,label:p+num,mult,num};
}

  topscore: {name:'Score max',        desc:'Nombre de volées fixe, le plus gros total gagne.'}
};
const CRICKET_TARGETS = [20,19,18,17,16,15,25];
function modeLabel(mode, conf){
  if(mode==='x01') return conf.start+' · '+(conf.doubleOut?'double out':'sortie libre');
  if(mode==='shanghai') return 'Shanghai · '+conf.rounds+' manches';
  if(mode==='topscore') return 'Score max · '+conf.turns+' volées';
  return MODES[mode].name;
}

let sb = null;        // client Supabase
let ONLINE = false;   // serveur joignable
let ME = null;        // profil connecté {id,name,photo,mail}

async function connectSupabase(){
  if(!SUPABASE_URL || !SUPABASE_KEY) return false;
  try{
    const mod = await import('https://esm.sh/@supabase/supabase-js@2');
    sb = mod.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
    ONLINE = true;
  }catch(e){ ONLINE = false; }
  return ONLINE;
}
async function ensureProfile(user){
  const {data} = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if(data) return data;
  const wanted = (user.user_metadata && user.user_metadata.name) || ('joueur'+user.id.slice(0,4));
  const {data:made, error} = await sb.from('profiles').insert({id:user.id, name:wanted}).select().single();
  if(error){
    const {data:retry} = await sb.from('profiles').insert({id:user.id, name:wanted+'-'+user.id.slice(0,4)}).select().single();
    return retry;
  }
  return made;
}
async function adoptSession(user){
  const prof = await ensureProfile(user);
  ME = prof ? {...prof, mail:user.email} : null;
  return ME;
}
function me(){
  if(ONLINE) return ME;
  const id = load(K.session, null);
  return id ? load(K.users,[]).find(u=>u.id===id) || null : null;
}
async function saveMe(patch){
  if(ONLINE && ME){
    const {data,error} = await sb.from('profiles').update(patch).eq('id', ME.id).select().single();
    if(error) throw error;
    ME = {...ME, ...data};
    return ME;
  }
  const all = load(K.users,[]); const i = all.findIndex(u=>u.id===load(K.session,null));
  if(i<0) return null;
  all[i] = {...all[i], ...patch}; save(K.users, all); return all[i];
}
function userById(id){
  if(ONLINE) return (S.cache.profiles||{})[id] || (ME && ME.id===id? ME : null);
  return load(K.users,[]).find(u=>u.id===id) || null;
}
function cacheProfiles(list){
  S.cache.profiles = S.cache.profiles || {};
  (list||[]).forEach(p=>{ if(p && p.id) S.cache.profiles[p.id]=p; });
}
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

/* ---------- retours utilisateur ---------- */
function toast(text, kind){
  const box = document.getElementById('toasts');
  if(!box) return;
  const t = el(`<div class="toast ${kind||''}">${esc(text)}</div>`);
  box.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .25s'; t.style.opacity='0'; setTimeout(()=>t.remove(), 260); }, 2600);
}
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

function ask(title, text, confirmLabel){
  return new Promise(resolve=>{
    const bg = el(`<div class="modal-bg">
      <div class="modal" role="dialog" aria-modal="true">
        <h2>${esc(title)}</h2>
        <p>${esc(text)}</p>
        <div class="row">
          <button class="btn btn-s" id="mk-no">Annuler</button>
          <button class="btn btn-p" id="mk-yes">${esc(confirmLabel||'Confirmer')}</button>
        </div>
      </div>
    </div>`);
    const close = v=>{ bg.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e=>{ if(e.key==='Escape') close(false); };
    bg.querySelector('#mk-no').onclick = ()=>close(false);
    bg.querySelector('#mk-yes').onclick = ()=>close(true);
    bg.onclick = e=>{ if(e.target===bg) close(false); };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(bg);
    bg.querySelector('#mk-yes').focus();
  });
}

/* garder l'écran allumé pendant une partie */
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); }
    else if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ wakeLock = null; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && S.view==='play' && !wakeLock) keepAwake(true);
});

/* bandeau quand le tour arrive */
let lastTurnKey = null;
function turnFlash(){
  const m = S.match;
  if(!m || m.winner){ lastTurnKey=null; return; }
  const key = m.id+':'+m.turn+':'+m.round;
  if(key===lastTurnKey) return;
  lastTurnKey = key;
  if(!canPlay() || m.players.length<2) return;
  const old = document.querySelector('.turn-flash'); if(old) old.remove();
  const f = el(`<div class="turn-flash">À toi de jouer, ${esc(cur().name)}</div>`);
  document.body.appendChild(f);
  buzz(30);
  setTimeout(()=>{ f.style.transition='opacity .3s'; f.style.opacity='0'; setTimeout(()=>f.remove(),320); }, 1500);
}

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function avatarHTML(u, size){
  const cls = 'av av-'+size;
  if(u && u.photo) return `<img class="${cls}" src="${u.photo}" alt="">`;
  return `<span class="${cls}">${esc(initials(u? u.name : '?'))}</span>`;
}
function ago(ts){
  const s = Math.floor((now()-ts)/1000);
  if(s<60) return 'à l\'instant';
  if(s<3600) return Math.floor(s/60)+' min';
  if(s<86400) return Math.floor(s/3600)+' h';
  if(s<604800) return Math.floor(s/86400)+' j';
  return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
function genCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let o='';
  for(let i=0;i<5;i++) o+=c[Math.floor(Math.random()*c.length)];
  return o;
}
const ROOT_VIEWS = ['home','feed','profile','auth'];
function go(view){
  S.err=null; S.msg=null; S.view=view;
  try{ history.pushState({view}, '', location.pathname); }catch(e){}
  render();
}
window.addEventListener('popstate', async ()=>{
  // le retour système ramène à l'écran précédent plutôt que de sortir de l'app
  if(S.view==='play'){
    const ok = await ask('Quitter la partie ?', 'La partie en cours sera perdue pour toi.', 'Quitter');
    if(!ok){ try{ history.pushState({view:'play'},'',location.pathname); }catch(e){} return; }
    stopSync(); stopCamera(); keepAwake(false);
    S.match=null; S.calib=null; S.calibPts=[];
    S.view='home'; render(); return;
  }
  if(S.view==='setup'){ S.view = S.setup && S.setup.context==='friend' ? 'friend' : 'home'; return render(); }
  if(S.view==='friend'){
    if(S.friendStep && S.friendStep!=='choice'){ S.friendStep='choice'; return render(); }
    S.view='home'; return render();
  }
  if(S.view==='end'){ S.match=null; S.view='home'; return render(); }
  if(!ROOT_VIEWS.includes(S.view)){ S.view='home'; return render(); }
  S.view = 'home'; render();
});

/* =========================================================
   MATCH ENGINE
========================================================= */
function makePlayer(cfg, mode, conf){
  const p = {
    id: uid(), uid: cfg.uid||null, name: cfg.name, photo: cfg.photo||null,
    isBot: !!cfg.isBot, skill: cfg.skill||0.55,
    legs:0, darts:0, totalScored:0, best:0, count180:0
  };
  if(mode==='x01') p.score = conf.start;
  if(mode==='cricket'){ p.marks={}; CRICKET_TARGETS.forEach(t=>p.marks[t]=0); p.points=0; }
  if(mode==='clock') p.target = 1;
  if(mode==='shanghai') p.points = 0;
  if(mode==='topscore') p.points = 0;
  return p;
}
function newMatch(setup){
  const conf = setup.conf;
  return {
    id: uid(), mode: setup.mode, conf, context: setup.context||'local',
    players: setup.players.map(p=>makePlayer(p, setup.mode, conf)),
    turn:0, round:0, throws:[], log:[], winner:null, startedAt: now(), shared:false
  };
}
function cur(){ return S.match.players[S.match.turn]; }
function isBotTurn(){ return S.match && !S.match.winner && cur().isBot; }
function canPlay(){
  const m = S.match;
  if(!m || m.winner) return false;
  const p = cur();
  if(p.isBot) return false;
  if(m.context==='online') return p.uid === (me()||{}).id;
  return true;
}
function myTurnOpen(){ return canPlay() && S.match.throws.length<3; }

function displayScore(m,p){
  if(m.mode==='x01') return p.score;
  if(m.mode==='cricket') return p.points;
  if(m.mode==='clock') return p.target>20 ? 'BULL' : p.target;
  return p.points;
}
function playerMeta(m,p){
  if(m.mode==='x01'){
    const avg = p.darts? (p.totalScored/p.darts*3).toFixed(1) : '0.0';
    return `${p.legs} manche${p.legs>1?'s':''} · moy ${avg}`;
  }
  if(m.mode==='cricket'){
    return CRICKET_TARGETS.map(t=>{
      const n=p.marks[t]; if(!n) return '';
      return (t===25?'B':t)+(n>=3?'✕':'·'.repeat(n));
    }).filter(Boolean).join(' ') || 'aucune marque';
  }
  if(m.mode==='clock') return p.target>20? 'dernier jet' : 'cible '+p.target;
  if(m.mode==='shanghai') return 'manche '+Math.min(m.round+1, m.conf.rounds)+'/'+m.conf.rounds;
  if(m.mode==='topscore'){
    const done = Math.floor(p.darts/3);
    return done+'/'+m.conf.turns+' volées';
  }
  return '';
}
function turnTargetLabel(m){
  const p = cur();
  if(m.mode==='x01'){
    const co = checkout(p.score, m.conf.doubleOut);
    return co ? 'Reste '+p.score+' · sortie '+co : 'Reste '+p.score;
  }
  if(m.mode==='cricket') return 'Cibles ouvertes : '+openTargets(m).map(t=>t===25?'Bull':t).join(' ');
  if(m.mode==='clock') return 'Cible : '+(p.target>20?'Bull':p.target);
  if(m.mode==='shanghai') return 'Manche '+(m.round+1)+' · cible '+(m.round+1);
  if(m.mode==='topscore') return 'Volée '+(Math.floor(p.darts/3)+1)+'/'+m.conf.turns;
  return '';
}
function openTargets(m){
  return CRICKET_TARGETS.filter(t=>m.players.some(p=>p.marks[t]<3));
}

/* ---------- add / undo dart ---------- */
function addDart(mult,num){
  const m = S.match;
  if(!m || m.winner || m.throws.length>=3) return;
  const d = dartOf(mult,num);
  m.throws.push(d);
  S.pending = null;
  S.pick.mult = 1;
  buzz(12);
  if(m.context==='online') pushMatch();
  if(m.throws.length>=3){ render(); setTimeout(resolveTurn, 380); }
  else render();
}
function undoDart(){
  const m=S.match; if(!m||m.winner) return;
  m.throws.pop(); S.pending=null;
  if(m.context==='online') pushMatch();
  render();
}

/* ---------- resolve turn ---------- */
function resolveTurn(){
  const m = S.match;
  if(!m || m.winner) return;
  const p = cur();
  const darts = m.throws.slice();
  const turnTotal = darts.reduce((s,d)=>s+d.value,0);
  p.darts += darts.length;
  let entry = {name:p.name, text: darts.map(d=>d.label).join(' · ') || 'aucun jet', bust:false, val:''};
  let win = false;

  if(m.mode==='x01'){
    const start = p.score;
    let rem = start - turnTotal;
    const last = darts[darts.length-1];
    let bust = rem<0 || (m.conf.doubleOut && rem===1);
    if(rem===0){
      if(!m.conf.doubleOut || (last && last.mult===2)) win = true;
      else bust = true;
    }
    if(bust){ entry.bust=true; entry.text += ' · bust'; entry.val = String(start); }
    else {
      p.score = rem; p.totalScored += turnTotal;
      if(turnTotal>p.best) p.best = turnTotal;
      if(turnTotal===180) p.count180++;
      entry.val = String(rem);
    }
  }

  else if(m.mode==='cricket'){
    let gained = 0;
    darts.forEach(d=>{
      if(!CRICKET_TARGETS.includes(d.num)) return;
      let hits = d.mult;
      const need = Math.max(0, 3 - p.marks[d.num]);
      const toMark = Math.min(need, hits);
      p.marks[d.num] += toMark;
      const extra = hits - toMark;
      if(extra>0){
        const closedByAll = m.players.every(q=>q.marks[d.num]>=3);
        if(!closedByAll){ p.points += extra*d.num; gained += extra*d.num; }
      }
    });
    p.totalScored += turnTotal;
    if(turnTotal>p.best) p.best = turnTotal;
    entry.val = gained? '+'+gained : '—';
    const allClosed = CRICKET_TARGETS.every(t=>p.marks[t]>=3);
    const topPoints = Math.max(...m.players.filter(q=>q!==p).map(q=>q.points));
    if(allClosed && p.points>=topPoints) win = true;
  }

  else if(m.mode==='clock'){
    let advanced = 0;
    darts.forEach(d=>{
      const tgt = p.target>20 ? 25 : p.target;
      if(d.num===tgt){ p.target++; advanced++; }
    });
    p.totalScored += turnTotal;
    entry.val = advanced? '+'+advanced : '—';
    if(p.target>21) win = true;
  }

  else if(m.mode==='shanghai'){
    const tgt = m.round+1;
    let gained = 0, mults = new Set();
    darts.forEach(d=>{ if(d.num===tgt){ gained += d.value; mults.add(d.mult); } });
    p.points += gained; p.totalScored += turnTotal;
    if(turnTotal>p.best) p.best = turnTotal;
    entry.val = gained? '+'+gained : '—';
    if(mults.has(1)&&mults.has(2)&&mults.has(3)){ win = true; entry.text += ' · shanghai'; }
  }

  else if(m.mode==='topscore'){
    p.points += turnTotal; p.totalScored += turnTotal;
    if(turnTotal>p.best) p.best = turnTotal;
    if(turnTotal===180) p.count180++;
    entry.val = String(p.points);
  }

  m.log.unshift(entry);
  if(m.log.length>50) m.log.pop();
  m.throws = [];

  if(win){ finishLeg(p); return; }

  m.turn = (m.turn+1) % m.players.length;
  if(m.context==='online') pushMatch();
  if(m.turn===0){
    m.round++;
    if(m.mode==='shanghai' && m.round>=m.conf.rounds) return endOnPoints();
    if(m.mode==='topscore' && m.players.every(q=>q.darts>=m.conf.turns*3)) return endOnPoints();
  }
  render();
  maybeBot();
}

function endOnPoints(){
  const m = S.match;
  const top = Math.max(...m.players.map(p=>p.points));
  const winner = m.players.find(p=>p.points===top);
  finishLeg(winner);
}

function finishLeg(p){
  const m = S.match;
  p.legs++;
  const target = m.conf.legs || 1;
  if(m.mode==='x01' && p.legs < target){
    m.players.forEach(q=>q.score = m.conf.start);
    m.throws = [];
    m.turn = (m.players.indexOf(p)+1) % m.players.length;
    m.log.unshift({name:p.name, text:'remporte la manche', bust:false, val:p.legs+'/'+target});
    if(m.context==='online') pushMatch();
    render();
    maybeBot();
    return;
  }
  m.winner = p.id;
  m.endedAt = now();
  buzz([40,60,120]);
  keepAwake(false);
  if(m.context==='online') pushMatch();
  stopSync();
  saveHistory(m);
  S.detecting = false;
  go('end');
}

function saveHistory(m){
  const u = me(); if(!u) return;
  const h = load(K.hist, []);
  const mine = m.players.find(p=>p.uid===u.id);
  h.unshift({
    id:m.id, mode:m.mode, at:m.endedAt, won: m.winner===(mine&&mine.id),
    best: mine? mine.best:0, avg: mine&&mine.darts? +(mine.totalScored/mine.darts*3).toFixed(1):0,
    c180: mine? mine.count180:0
  });
  save(K.hist, h.slice(0,200));
}

/* ---------- bot ---------- */
function maybeBot(){
  if(botTimer) clearTimeout(botTimer);
  if(!isBotTurn()) return;
  // en ligne, seul l'appareil de l'hôte fait jouer l'ordinateur
  if(S.match.context==='online' && S.match.hostId !== (me()||{}).id) return;
  botTimer = setTimeout(botThrow, 900);
}
function botThrow(){
  const m = S.match;
  if(!m || m.winner || !isBotTurn()) return;
  const p = cur();
  const d = botDart(m,p);
  m.throws.push(d);
  if(m.context==='online') pushMatch();
  render();
  if(m.throws.length>=3) botTimer = setTimeout(resolveTurn, 700);
  else botTimer = setTimeout(botThrow, 800);
}
function botAim(m,p){
  if(m.mode==='x01'){
    const rem = p.score - m.throws.reduce((s,d)=>s+d.value,0);
    if(rem<=40 && rem>0 && rem%2===0 && m.conf.doubleOut) return {mult:2,num:rem/2};
    if(rem<=50 && rem>0 && !m.conf.doubleOut) return {mult:1,num:Math.min(20,rem)};
    if(rem>170 || rem<=0) return {mult:3,num:20};
    if(rem<=60 && rem>40) return {mult:1,num:rem-40>0? Math.min(20,rem-40):20};
    return {mult:3,num:20};
  }
  if(m.mode==='cricket'){
    const open = openTargets(m).filter(t=>p.marks[t]<3);
    const t = open.length? open[0] : (openTargets(m)[0]||20);
    return {mult: t===25?1:3, num:t};
  }
  if(m.mode==='clock') return {mult:1, num: p.target>20?25:p.target};
  if(m.mode==='shanghai') return {mult:3, num:m.round+1};
  return {mult:3,num:20};
}
function botDart(m,p){
  const aim = botAim(m,p);
  const acc = p.skill;
  const r = Math.random();
  if(r < acc) return dartOf(aim.mult, aim.num);
  if(r < acc + (1-acc)*0.55){
    const mult = aim.mult===3? 1 : (aim.mult===2? 1 : 1);
    return dartOf(mult, aim.num);
  }
  if(r < acc + (1-acc)*0.85){
    const i = SECTORS.indexOf(aim.num===25?20:aim.num);
    const nb = SECTORS[(i + (Math.random()<0.5?1:19)) % 20];
    return dartOf(1, nb);
  }
  return dartOf(0,0);
}

let camNode = null;

function ensureCamNode(){
  if(camNode) return camNode;
  camNode = el(`<div class="cam">
    <video id="video" playsinline muted autoplay></video>
    <canvas class="ov" id="ov"></canvas>
    <div class="cam-badge" id="cambadge"><span class="d"></span><span id="cambadgetxt">caméra coupée</span></div>
    <div class="cam-target" id="camtarget"></div>
    <div class="cam-hint" id="camhint"></div>
  </div>`);
  video = camNode.querySelector('#video');
  ovC = camNode.querySelector('#ov');
  ovX = ovC.getContext('2d');
  if(!wkC){ wkC = document.createElement('canvas'); wkX = wkC.getContext('2d'); }
  video.addEventListener('loadedmetadata', resizeOverlay);
  window.addEventListener('resize', resizeOverlay);
  window.addEventListener('orientationchange', ()=>setTimeout(resizeOverlay,300));
  ovC.addEventListener('click', onBoardTap);
  ovC.addEventListener('touchstart', e=>{ e.preventDefault(); onBoardTap(e); }, {passive:false});
  return camNode;
}
function resizeOverlay(){
  if(!ovC || !video) return;
  const r = video.getBoundingClientRect();
  if(!r.width) return;
  const prevW = ovC.width, prevH = ovC.height;
  const w = Math.round(r.width), h = Math.round(r.height);
  if(w===prevW && h===prevH){ drawOverlay(); return; }
  if(prevW && prevH && (S.calibPts.length || S.calib)) rescaleCalib(w/prevW, h/prevH);
  ovC.width = w; ovC.height = h;
  drawOverlay();
}
function rescaleCalib(fx,fy){
  S.calibPts = S.calibPts.map(([x,y])=>[x*fx,y*fy]);
  if(S.calib){
    const pts = S.calib.pts.map(([x,y])=>[x*fx,y*fy]);
    setCalib(pts, false);
  }
}
function setCalib(pts, persist){
  const Hb = solveHomography(pts, CAL_TARGETS);
  S.calib = {pts:pts.slice(), Hb, Himg:invH(Hb)};
  S.refFrame = null;
  if(persist!==false && ovC) save(K.calib, {pts, w:ovC.width, h:ovC.height});
}
function loadCalib(){
  const c = load(K.calib, null);
  if(!c || !ovC || !ovC.width) return false;
  const fx = ovC.width/c.w, fy = ovC.height/c.h;
  setCalib(c.pts.map(([x,y])=>[x*fx,y*fy]), false);
  return true;
}
async function startCamera(){
  ensureCamNode();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1280}, height:{ideal:960}}, audio:false});
    video.srcObject = stream;
    await video.play();
    S.camOn = true; S.err = null;
    setTimeout(()=>{ resizeOverlay(); if(!S.calib) loadCalib(); drawOverlay(); renderCamHint(); }, 350);
  }catch(e){
    S.camOn = false;
    S.err = "La caméra n'a pas démarré. Vérifie l'autorisation du navigateur, ou compte au clavier.";
  }
  render();
}
function stopCamera(){
  try{ if(video && video.srcObject){ video.srcObject.getTracks().forEach(t=>t.stop()); video.srcObject=null; } }catch(e){}
  if(detectTimer){ clearTimeout(detectTimer); detectTimer=null; }
  S.camOn=false; S.detecting=false; S.refFrame=null; S.candidate=null;
}
function vScale(){
  const vw = video.videoWidth||640, vh = video.videoHeight||480;
  return {vw, vh, sx: ovC.width/vw, sy: ovC.height/vh};
}
function drawRing(H,r){
  ovX.beginPath();
  for(let a=0;a<=360;a+=6){
    const t=a*Math.PI/180;
    const [ix,iy]=applyH(H, r*Math.sin(t), r*Math.cos(t));
    if(a===0) ovX.moveTo(ix,iy); else ovX.lineTo(ix,iy);
  }
  ovX.stroke();
}
function drawOverlay(){
  if(!ovX) return;
  ovX.clearRect(0,0,ovC.width,ovC.height);
  if(S.calib){
    ovX.strokeStyle='rgba(226,58,46,.85)'; ovX.lineWidth=1.5;
    [1.0,R_DBL_IN,R_TRI_OUT,R_TRI_IN,R_BULL,R_DBULL].forEach(r=>drawRing(S.calib.Himg,r));
    ovX.fillStyle='rgba(226,58,46,.9)';
    S.calib.pts.forEach(([x,y])=>{ ovX.beginPath(); ovX.arc(x,y,3.5,0,Math.PI*2); ovX.fill(); });
  } else if(S.calibPts.length){
    ovX.fillStyle='rgba(226,58,46,.9)'; ovX.font='12px Arial, sans-serif';
    S.calibPts.forEach(([x,y],i)=>{
      ovX.beginPath(); ovX.arc(x,y,5,0,Math.PI*2); ovX.fill();
      ovX.fillText(String(i+1), x+8, y-8);
    });
  }
  if(S.candidate){
    ovX.strokeStyle='rgba(63,169,91,.95)'; ovX.lineWidth=2.5;
    ovX.beginPath(); ovX.arc(S.candidate.x,S.candidate.y,13,0,Math.PI*2); ovX.stroke();
  }
}
function onBoardTap(evt){
  if(!ovC) return;
  const rect = ovC.getBoundingClientRect();
  const cx = (evt.touches? evt.touches[0].clientX : evt.clientX) - rect.left;
  const cy = (evt.touches? evt.touches[0].clientY : evt.clientY) - rect.top;
  const px = cx*(ovC.width/rect.width), py = cy*(ovC.height/rect.height);
  if(!S.calib){
    if(S.calibPts.length<4){
      S.calibPts.push([px,py]);
      if(S.calibPts.length===4) setCalib(S.calibPts.slice(), true);
      drawOverlay(); render();
    }
    return;
  }
  if(S.view==='play' && myTurnOpen()){
    S.pending = {...scoreAt(px,py), x:px, y:py};
    render();
  }
}
function scoreAt(px,py){
  const [qx,qy] = applyH(S.calib.Hb, px, py);
  const r = Math.hypot(qx,qy);
  if(r>R_DBL_OUT) return dartOf(0,0);
  if(r<R_DBULL) return dartOf(2,25);
  if(r<R_BULL) return dartOf(1,25);
  let th = Math.atan2(qx,qy);
  th = ((th % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  const num = SECTORS[Math.round(th/(Math.PI/10)) % 20];
  let mult = 1;
  if(r>=R_TRI_IN && r<=R_TRI_OUT) mult=3;
  else if(r>=R_DBL_IN && r<=R_DBL_OUT) mult=2;
  return dartOf(mult,num);
}
function captureBaseline(){
  const {vw,vh} = vScale();
  wkC.width=vw; wkC.height=vh;
  wkX.drawImage(video,0,0,vw,vh);
  S.refFrame = wkX.getImageData(0,0,vw,vh);
  S.detecting = true; S.candidate=null;
  render(); loopDetect();
}
function loopDetect(){
  if(detectTimer) clearTimeout(detectTimer);
  if(!S.detecting || S.view!=='play') return;
  detectFrame();
  detectTimer = setTimeout(loopDetect, 260);
}
function calibBox(vw,vh){
  const s = vw/ovC.width;
  const xs = S.calib.pts.map(p=>p[0]*s), ys = S.calib.pts.map(p=>p[1]*s);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const mx=(x1-x0)*0.18, my=(y1-y0)*0.18;
  return {minX:Math.max(0,Math.floor(x0-mx)), maxX:Math.min(vw,Math.ceil(x1+mx)), minY:Math.max(0,Math.floor(y0-my)), maxY:Math.min(vh,Math.ceil(y1+my))};
}
function detectFrame(){
  if(!S.refFrame || !S.calib || !video) return;
  if(!myTurnOpen()) return;
  const {vw,vh} = vScale();
  if(wkC.width!==vw){ wkC.width=vw; wkC.height=vh; }
  wkX.drawImage(video,0,0,vw,vh);
  const curFrame = wkX.getImageData(0,0,vw,vh);
  const ref = S.refFrame;
  const {minX,maxX,minY,maxY} = calibBox(vw,vh);
  let sx=0, sy=0, n=0;
  const step=4;
  for(let y=minY;y<maxY;y+=step){
    for(let x=minX;x<maxX;x+=step){
      const i=(y*vw+x)*4;
      const diff = Math.abs(curFrame.data[i]-ref.data[i]) + Math.abs(curFrame.data[i+1]-ref.data[i+1]) + Math.abs(curFrame.data[i+2]-ref.data[i+2]);
      if(diff>90){ sx+=x; sy+=y; n++; }
    }
  }
  const area = (maxX-minX)*(maxY-minY)/(step*step);
  const ratio = n/Math.max(1,area);
  if(n<6 || ratio>0.35){ S.candidate=null; drawOverlay(); return; }
  const scale = ovC.width/vw;
  const ox=(sx/n)*scale, oy=(sy/n)*scale;
  if(S.candidate && Math.hypot(S.candidate.x-ox, S.candidate.y-oy)<16) S.candidate.age++;
  else S.candidate = {x:ox,y:oy,age:1};
  drawOverlay();
  if(S.candidate.age>=3){
    const sc = scoreAt(ox,oy);
    S.refFrame = curFrame;
    S.candidate = null;
    if(sc.num!==0){ S.pending = {...sc, x:ox, y:oy}; render(); }
  }
}

const V = {};

function authError(e){
  const m = (e && (e.message||e.error_description)) || '';
  if(/Invalid login credentials/i.test(m)) return 'Mail ou mot de passe incorrect.';
  if(/Email not confirmed/i.test(m)) return "Ce compte n'est pas encore confirmé. Ouvre le mail de confirmation.";
  if(/User already registered/i.test(m)) return 'Un compte existe déjà avec cette adresse.';
  if(/rate limit|too many/i.test(m)) return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(/only request this after (\d+)/i.test(m)) return 'Patiente '+m.match(/after (\d+)/i)[1]+' secondes avant de redemander un mail.';
  if(/email address .*invalid|invalid email/i.test(m)) return "Cette adresse mail n'est pas acceptée par le serveur. Vérifie l'orthographe.";
  if(/signups not allowed|disabled/i.test(m)) return "Les inscriptions sont désactivées sur le projet.";
  if(/Password/i.test(m)) return 'Mot de passe trop court ou trop simple.';
  return m || 'La connexion au serveur a échoué.';
}
/* retour depuis un mail de confirmation ou un lien magique */
async function handleAuthReturn(){
  const q = new URLSearchParams(location.search);
  const h = new URLSearchParams(location.hash.replace(/^#/,''));
  const err = q.get('error_description') || h.get('error_description');
  const code = q.get('code');
  const hasToken = !!h.get('access_token');
  const tokenHash = q.get('token_hash');
  const type = q.get('type');
  if(!err && !code && !hasToken && !tokenHash) return;

  if(err){
    S.err = /expired|invalid/i.test(err)
      ? "Ce lien de confirmation a expiré. Demande un nouveau mail depuis l'écran de connexion."
      : err;
    cleanUrl();
    return;
  }
  try{
    if(code) await sb.auth.exchangeCodeForSession(code);
    else if(tokenHash) await sb.auth.verifyOtp({token_hash:tokenHash, type: type||'email'});
    // le cas access_token est traité automatiquement par le client
    const {data} = await sb.auth.getSession();
    if(data && data.session){
      S.msg = type==='recovery' ? 'Lien validé, tu peux changer ton mot de passe.' : 'Adresse confirmée, te voilà connectée.';
    } else {
      S.msg = 'Adresse confirmée. Connecte-toi avec ton mot de passe.';
    }
  }catch(e){
    S.err = "La confirmation n'a pas pu être finalisée. Réessaie depuis l'écran de connexion.";
  }
  cleanUrl();
}
function cleanUrl(){
  try{ history.replaceState({}, '', location.pathname); }catch(e){}
}

/* renvoyer un mail de confirmation */
async function resendConfirmation(mail){
  if(!ONLINE) return {err:'Serveur injoignable.'};
  if(!/^\S+@\S+\.\S+$/.test(mail)) return {err:'Entre ton adresse mail au-dessus, puis redemande le lien.'};
  const {error} = await sb.auth.resend({type:'signup', email:mail, options:{emailRedirectTo: location.origin + location.pathname}});
  if(error) return {err: authError(error)};
  return {ok:'Nouveau mail envoyé. Pense à regarder dans les indésirables.'};
}

async function refreshCaches(){
  if(!ONLINE || !ME) return;
  await Promise.all([loadFriends(), loadFeed()]);
  render();
}

V.auth = function(){
  const login = S.authMode==='login';
  const root = el(`<div class="stack" style="gap:20px;">

    </div>

    ${S.msg? `<p class="ok-msg">${esc(S.msg)}</p>`:''}
    <div class="card">
      ${login?'':`<div><label class="fl" for="a-name">Pseudo</label><input id="a-name" type="text" placeholder="Ton nom de joueur" autocomplete="nickname"></div>`}
      <div><label class="fl" for="a-mail">Adresse mail</label><input id="a-mail" type="email" placeholder="toi@exemple.fr" autocomplete="email"></div>
      <div><label class="fl" for="a-pass">Mot de passe</label><input id="a-pass" type="password" placeholder="8 caractères minimum" autocomplete="${login?'current-password':'new-password'}"></div>
      <button class="btn btn-p wide" id="a-go">${login?'Se connecter':'Créer mon compte'}</button>
    </div>
    <div style="text-align:center;display:flex;flex-direction:column;gap:2px;">
      <button class="btn-q" id="a-switch">${login?'Pas encore de compte, en créer un':'Déjà un compte, se connecter'}</button>
      ${login && ONLINE? `<button class="btn-q" id="a-resend">Renvoyer le mail de confirmation</button>`:''}
    </div>
    <p class="small" style="text-align:center;">${ONLINE? 'Compte synchronisé, tu le retrouves sur tous tes appareils.' : 'Hors connexion : le compte reste sur cet appareil.'}</p>
  </div>`);
  root.querySelector('#a-switch').onclick = ()=>{ S.authMode = login?'signup':'login'; S.err=null; render(); };
  root.querySelector('#a-go').onclick = async ()=>{
    const btn = root.querySelector('#a-go');
    const mail = root.querySelector('#a-mail').value.trim().toLowerCase();
    const pass = root.querySelector('#a-pass').value;
    const name = login? '' : root.querySelector('#a-name').value.trim();
    S.err = null; S.msg = null;

    if(!/^\S+@\S+\.\S+$/.test(mail)){ S.err='Cette adresse mail n\'est pas valide.'; return render(); }
    if(pass.length<8){ S.err='Le mot de passe doit faire 8 caractères minimum.'; return render(); }
    if(!login && name.length<2){ S.err='Choisis un pseudo d\'au moins 2 caractères.'; return render(); }

    btn.disabled = true; btn.textContent = login? 'Connexion…' : 'Création…';

    if(ONLINE){
      try{
        if(login){
          const {data, error} = await sb.auth.signInWithPassword({email:mail, password:pass});
          if(error) throw error;
          await adoptSession(data.user);
          go('home'); refreshCaches();
        } else {
          const {data:taken} = await sb.from('profiles').select('id').ilike('name', name).maybeSingle();
          if(taken){ S.err='Ce pseudo est déjà pris.'; return render(); }
          const {data, error} = await sb.auth.signUp({
            email:mail, password:pass,
            options:{data:{name}, emailRedirectTo: location.origin + location.pathname}
          });
          if(error) throw error;
          if(!data.session){
            S.authMode='login';
            S.msg='Compte créé. Ouvre le mail de confirmation, puis connecte-toi.';
            return render();
          }
          await adoptSession(data.user);
          go('home'); refreshCaches();
        }
      }catch(e){
        S.err = authError(e);
        render();
      }
      return;
    }

    // hors connexion : comptes locaux
    const all = load(K.users,[]);
    if(login){
      const u = all.find(x=>x.mail===mail);
      if(!u || u.pass!==btoa(pass)){ S.err='Mail ou mot de passe incorrect.'; return render(); }
      save(K.session,u.id); go('home');
    } else {
      if(all.some(x=>x.mail===mail)){ S.err='Un compte existe déjà avec cette adresse.'; return render(); }
      if(all.some(x=>x.name.toLowerCase()===name.toLowerCase())){ S.err='Ce pseudo est déjà pris.'; return render(); }
      const u = {id:uid(), name, mail, pass:btoa(pass), photo:null, friends:[], createdAt:now()};
      all.push(u); save(K.users, all); save(K.session,u.id);
      go('home');
    }
  };
  const rs = root.querySelector('#a-resend');
  if(rs) rs.onclick = async ()=>{
    rs.disabled = true; rs.textContent = 'Envoi…';
    const r = await resendConfirmation(root.querySelector('#a-mail').value.trim().toLowerCase());
    S.err = r.err||null; S.msg = r.ok||null;
    render();
  };
  root.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') root.querySelector('#a-go').click(); }));
  return root;
};

function startMatch(){
  S.match = newMatch(S.setup);
  S.showCam = !!load(K.camPref, false);
  S.pending = null;
  go('play');
  if(S.showCam && !S.camOn) startCamera();
  maybeBot();
}

async function startOnlineMatch(){
  const r = S.room;
  S.setup = {...r.setup, context:'online'};
  const m = newMatch(S.setup);
  m.code = r.code; m.rev = 1; m.hostId = (me()||{}).id;
  S.match = m;
  const patch = {status:'playing', state:m};
  if(ONLINE) await sb.from('rooms').update(patch).eq('code', r.code);
  else { const all = rooms(); all[r.code] = {...all[r.code], ...patch}; save(K.rooms, all); }
  stopWatchRoom();
  S.room = null;
  S.showCam = !!load(K.camPref, false);
  S.pending = null;
  go('play');
  if(S.showCam && !S.camOn) startCamera();
  startSync();
}

function rooms(){ return load(K.rooms, {}); }
let roomTimer = null, syncTimer = null;

async function createRoom(){
  const code = genCode();
  const u = me();
  if(ONLINE){
    const {data, error} = await sb.from('rooms').insert({code, host:u.id, setup:S.setup, status:'waiting'}).select().single();
    if(error){ S.err = "La partie n'a pas pu être créée. Réessaie."; return render(); }
    S.room = data;
  } else {
    const all = rooms();
    all[code] = {code, host:u.id, setup:S.setup, status:'waiting', createdAt:now()};
    save(K.rooms, all);
    S.room = all[code];
  }
  S.friendStep='wait';
  go('friend');
  watchRoom();
}

async function joinRoom(codeRaw){
  const code = (codeRaw||'').trim().toUpperCase();
  const u = me();
  if(!code){ S.err='Entre le code reçu de ton ami.'; return render(); }
  if(ONLINE){
    const {data:r} = await sb.from('rooms').select('*').eq('code', code).maybeSingle();
    if(!r){ S.err = 'Aucune partie ne correspond à ce code. Vérifie-le avec ton ami.'; return render(); }
    if(r.status!=='waiting'){ S.err = 'Cette partie a déjà démarré.'; return render(); }
    const setup = r.setup;
    if(setup.players.length>=4 && !setup.players.some(p=>p.uid===u.id)){ S.err='Cette partie est complète.'; return render(); }
    if(!setup.players.some(p=>p.uid===u.id)) setup.players.push({uid:u.id, name:u.name, photo:u.photo});
    const {data:up, error} = await sb.from('rooms').update({setup}).eq('code', code).select().single();
    if(error){ S.err = "Impossible de rejoindre. Réessaie."; return render(); }
    S.room = up; S.friendStep='wait'; S.err=null;
    render(); watchRoom();
    return;
  }
  const all = rooms();
  const r = all[code];
  if(!r){ S.err = 'Aucune partie ne correspond à ce code. Vérifie-le avec ton ami.'; return render(); }
  if(r.setup.players.length>=4){ S.err = 'Cette partie est complète.'; return render(); }
  if(!r.setup.players.some(p=>p.uid===u.id)) r.setup.players.push({uid:u.id, name:u.name, photo:u.photo});
  all[code]=r; save(K.rooms, all);
  S.room = r; S.friendStep='wait'; S.err=null;
  render(); watchRoom();
}

/* le salon d'attente se rafraîchit, et bascule en partie dès que l'hôte lance */
function watchRoom(){
  stopWatchRoom();
  if(!S.room) return;
  roomTimer = setInterval(async ()=>{
    if(!S.room || S.view!=='friend'){ return; }
    let r = null;
    if(ONLINE){
      const {data} = await sb.from('rooms').select('*').eq('code', S.room.code).maybeSingle();
      r = data;
    } else {
      r = rooms()[S.room.code];
    }
    if(!r) return;
    const changed = JSON.stringify(r.setup.players) !== JSON.stringify(S.room.setup.players);
    S.room = r;
    if(r.status==='playing' && r.state){
      stopWatchRoom();
      S.match = r.state;
      S.match.code = r.code;
      S.showCam = !!load(K.camPref,false);
      go('play');
      if(S.showCam && !S.camOn) startCamera();
      startSync();
      return;
    }
    if(changed) render();
  }, 2000);
}
function stopWatchRoom(){ if(roomTimer){ clearInterval(roomTimer); roomTimer=null; } }

async function deleteRoom(){
  stopWatchRoom();
  if(!S.room) return;
  if(ONLINE){ await sb.from('rooms').delete().eq('code', S.room.code); }
  else { const all = rooms(); delete all[S.room.code]; save(K.rooms, all); }
  S.room = null;
}

/* --- synchronisation de la partie entre appareils --- */
async function pushMatch(){
  const m = S.match;
  if(!m || m.context!=='online' || !m.code) return;
  m.rev = (m.rev||0)+1;
  const patch = {state:m, status: m.winner? 'done':'playing'};
  if(ONLINE) await sb.from('rooms').update(patch).eq('code', m.code);
  else { const all=rooms(); if(all[m.code]){ all[m.code]={...all[m.code], ...patch}; save(K.rooms,all); } }
}
async function pullMatch(){
  const m = S.match;
  if(!m || m.context!=='online' || !m.code) return;
  let r = null;
  if(ONLINE){ const {data} = await sb.from('rooms').select('state,status').eq('code', m.code).maybeSingle(); r = data; }
  else { r = rooms()[m.code]; }
  if(!r || !r.state) return;
  if((r.state.rev||0) > (m.rev||0)){
    const wasWinner = m.winner;
    S.match = r.state; S.match.code = m.code;
    if(S.match.winner && !wasWinner){ stopSync(); saveHistory(S.match); S.detecting=false; return go('end'); }
    render();
    maybeBot();
  }
}
function startSync(){
  stopSync();
  if(!S.match || S.match.context!=='online') return;
  syncTimer = setInterval(pullMatch, 1600);
}
function stopSync(){ if(syncTimer){ clearInterval(syncTimer); syncTimer=null; } }

function camTargetLabel(m){
  const p = cur();
  if(m.mode==='x01'){ const co = checkout(p.score, m.conf.doubleOut); return co? 'sortie '+co : 'reste '+p.score; }
  if(m.mode==='cricket'){ const o = CRICKET_TARGETS.filter(t=>p.marks[t]<3); return o.length? 'à fermer '+o.slice(0,3).map(t=>t===25?'bull':t).join(' ') : 'marquer les points'; }
  if(m.mode==='clock') return 'cible '+(p.target>20?'bull':p.target);
  if(m.mode==='shanghai') return 'cible '+(m.round+1);
  if(m.mode==='topscore') return 'volée '+(Math.floor(p.darts/3)+1)+'/'+m.conf.turns;
  return '';
}

function rankPlayers(m){
  const ps = m.players.slice();
  if(m.mode==='x01') return ps.sort((a,b)=> b.legs-a.legs || a.score-b.score);
  if(m.mode==='clock') return ps.sort((a,b)=> b.target-a.target);
  return ps.sort((a,b)=> b.points-a.points);
}
function resultValue(m,p){
  if(m.mode==='x01') return p.legs+' · reste '+p.score;
  if(m.mode==='clock') return p.target>21? 'terminé' : 'cible '+Math.min(p.target,21);
  if(m.mode==='cricket') return p.points+' pts';
  return p.points+' pts';
}

/* ---------- feed ---------- */
function feed(){ return ONLINE ? (S.cache.feed||[]) : load(K.feed, []); }

async function loadFeed(){
  if(!ONLINE) return;
  const {data:posts, error} = await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(60);
  if(error || !posts){ S.cache.feedLoaded = true; return; }
  const ids = posts.map(p=>p.id);
  const authorIds = [...new Set(posts.map(p=>p.user_id))];
  const [{data:authors}, {data:likes}, {data:comments}] = await Promise.all([
    sb.from('profiles').select('*').in('id', authorIds.length?authorIds:['00000000-0000-0000-0000-000000000000']),
    ids.length? sb.from('likes').select('*').in('post_id', ids) : Promise.resolve({data:[]}),
    ids.length? sb.from('comments').select('*').in('post_id', ids).order('created_at') : Promise.resolve({data:[]})
  ]);
  cacheProfiles(authors);
  const commenterIds = [...new Set((comments||[]).map(c=>c.user_id))].filter(id=>!S.cache.profiles[id]);
  if(commenterIds.length){
    const {data:more} = await sb.from('profiles').select('*').in('id', commenterIds);
    cacheProfiles(more);
  }
  S.cache.feed = posts.map(p=>({
    id:p.id, uid:p.user_id, at:new Date(p.created_at).getTime(), text:p.text||'',
    mode:p.mode, subtitle:p.subtitle||'', lines:p.lines||[], chips:p.chips||[],
    likes:(likes||[]).filter(l=>l.post_id===p.id).map(l=>l.user_id),
    comments:(comments||[]).filter(c=>c.post_id===p.id).map(c=>({
      uid:c.user_id, name:(S.cache.profiles[c.user_id]||{}).name||'Joueur', text:c.text, at:new Date(c.created_at).getTime()
    }))
  }));
  S.cache.feedLoaded = true;
}

async function loadFriends(){
  if(!ONLINE || !ME) return;
  const {data:links} = await sb.from('friends').select('friend_id').eq('user_id', ME.id);
  const ids = (links||[]).map(l=>l.friend_id);
  if(!ids.length){ S.cache.friends = []; S.cache.friendsLoaded = true; return; }
  const {data:profs} = await sb.from('profiles').select('*').in('id', ids);
  cacheProfiles(profs);
  S.cache.friends = profs||[];
  S.cache.friendsLoaded = true;
}

async function publishMatch(m, text){
  const u = me();
  const ranked = rankPlayers(m);
  const mine = m.players.find(p=>p.uid===u.id);
  const post = {
    id: uid(), uid:u.id, at: now(), text: (text||'').trim(),
    mode: m.mode,
    subtitle: m.mode==='x01'? m.conf.start+' · '+(m.conf.doubleOut?'double out':'sortie libre') : MODES[m.mode].desc.split(',')[0],
    lines: ranked.map(p=>({name:p.name, val:resultValue(m,p), win:p.id===m.winner})),
    chips: mine? [
      'moy '+(mine.darts? (mine.totalScored/mine.darts*3).toFixed(1):'0'),
      'meilleure volée '+mine.best,
      mine.count180? mine.count180+' × 180' : null,
      m.winner===mine.id? 'victoire' : null
    ].filter(Boolean) : [],
    likes:[], comments:[]
  };
  if(ONLINE){
    const {error} = await sb.from('posts').insert({
      user_id:u.id, text:post.text, mode:post.mode, subtitle:post.subtitle,
      lines:post.lines, chips:post.chips
    });
    if(error) throw error;
    await loadFeed();
    return;
  }
  const f = load(K.feed,[]); f.unshift(post); save(K.feed, f.slice(0,300));
}

async function addFriendByName(name){
  if(ONLINE){
    const {data:t} = await sb.from('profiles').select('*').ilike('name', name).maybeSingle();
    if(!t) return {err:'Aucun joueur ne porte ce pseudo.'};
    if(t.id===ME.id) return {err:"Difficile de s'ajouter soi-même."};
    if((S.cache.friends||[]).some(f=>f.id===t.id)) return {err:t.name+' fait déjà partie de tes amis.'};
    const {error} = await sb.from('friends').insert({user_id:ME.id, friend_id:t.id});
    if(error) return {err:"L'ajout a échoué. Réessaie."};
    await loadFriends();
    return {ok:t.name+' a été ajouté à tes amis.'};
  }
  const u = me();
  const t = load(K.users,[]).find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!t) return {err:'Aucun joueur ne porte ce pseudo.'};
  if(t.id===u.id) return {err:"Difficile de s'ajouter soi-même."};
  if((u.friends||[]).includes(t.id)) return {err:t.name+' fait déjà partie de tes amis.'};
  await saveMe({friends:[...(u.friends||[]), t.id]});
  return {ok:t.name+' a été ajouté à tes amis.'};
}

}

    if(inp && inp.value.trim()) addComment(id, inp.value.trim());
  });
  root.querySelectorAll('input[data-cinput]').forEach(i=>i.addEventListener('keydown',e=>{
    if(e.key==='Enter' && i.value.trim()) addComment(i.dataset.cinput, i.value.trim());
  }));
  return root;
};
function postHTML(p){
  const u = userById(p.uid);
  const liked = (p.likes||[]).includes(load(K.session,null));
  return `<div class="post">
    <div class="post-head">
      ${avatarHTML(u,40)}
      <div><div class="pu">${esc(u? u.name : 'Joueur')}</div><div class="pt">${p.mode==='x01'? esc(p.subtitle) : MODES[p.mode].name+' · '+esc(p.subtitle)} · ${ago(p.at)}</div></div>
    </div>
    ${p.text? `<p class="post-body">${esc(p.text)}</p>`:''}
    <div class="result-box">
      ${p.lines.map(l=>`<div class="result-line ${l.win?'win':''}"><span class="rn">${esc(l.name)}</span><span class="tnum">${esc(l.val)}</span></div>`).join('')}
    </div>
    ${p.chips.length? `<div class="chips">${p.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`:''}
    <div class="post-actions">
      <button data-like="${p.id}" class="${liked?'liked':''}">${liked?'Bravo envoyé':'Bravo'} ${p.likes.length? '· '+p.likes.length:''}</button>
      <button data-cm="${p.id}">Commenter ${p.comments.length? '· '+p.comments.length:''}</button>
    </div>
    ${p.comments.length? p.comments.map(c=>`<div class="comment"><b>${esc(c.name)}</b><span>${esc(c.text)}</span></div>`).join(''):''}
    <div class="hidden" id="cm-${p.id}">
      <div class="row" style="gap:6px;">
        <input type="text" id="ci-${p.id}" data-cinput="${p.id}" placeholder="Écrire un commentaire">
        <button class="btn btn-s sm" data-send="${p.id}" style="flex:0 0 auto;">Envoyer</button>
      </div>
    </div>
  </div>`;
}
async function toggleLike(id){
  const p = feed().find(x=>x.id===id); if(!p) return;
  const meId = (me()||{}).id;
  const liked = (p.likes||[]).includes(meId);
  // retour visuel immédiat, puis écriture
  p.likes = liked ? p.likes.filter(x=>x!==meId) : [...(p.likes||[]), meId];
  render();
  if(ONLINE){
    if(liked) await sb.from('likes').delete().eq('post_id', id).eq('user_id', meId);
    else await sb.from('likes').insert({post_id:id, user_id:meId});
    return;
  }
  const f = load(K.feed,[]); const lp = f.find(x=>x.id===id);
  if(lp){ lp.likes = p.likes; save(K.feed,f); }
}
async function addComment(id, text){
  const p = feed().find(x=>x.id===id); if(!p) return;
  const u = me();
  p.comments.push({uid:u.id, name:u.name, text, at:now()});
  render();
  if(ONLINE){
    await sb.from('comments').insert({post_id:id, user_id:u.id, text});
    return;
  }
  const f = load(K.feed,[]); const lp = f.find(x=>x.id===id);
  if(lp){ lp.comments = p.comments; save(K.feed,f); }
}

/* ---------- profile ---------- */
V.profile = function(){
  const u = me();
  const h = load(K.hist, []);
  const wins = h.filter(x=>x.won).length;
  const best = h.reduce((a,x)=>Math.max(a,x.best||0),0);
  const avg = h.length? (h.reduce((a,x)=>a+(x.avg||0),0)/h.length).toFixed(1) : '0.0';
  const c180 = h.reduce((a,x)=>a+(x.c180||0),0);
  const fr = friendsOf(u);
  const root = el(`<div class="stack" style="gap:18px;">
    <div class="between"><h1 style="font-size:22px;">Profil</h1><button class="btn-q" id="pr-out">Se déconnecter</button></div>
    ${S.msg? `<p class="ok-msg">${esc(S.msg)}</p>`:''}
    ${S.err? `<p class="err">${esc(S.err)}</p>`:''}
    <div class="card">
      <div style="display:flex;gap:14px;align-items:center;">
        ${avatarHTML(u,72)}
        <div class="stack sm" style="flex:1;gap:6px;">
          <div style="font-size:19px;font-weight:bold;">${esc(u.name)}</div>
          <div class="small">${esc(u.mail)}</div>
          <div class="row" style="gap:6px;">
            <button class="btn btn-s sm" id="pr-photo">${u.photo?'Changer la photo':'Ajouter une photo'}</button>
            ${u.photo? `<button class="btn btn-s sm" id="pr-rmphoto" style="flex:0 0 auto;">Retirer</button>`:''}
          </div>
        </div>
      </div>
      <input type="file" id="pr-file" accept="image/*" class="hidden">
      <div class="rule"></div>
      <div><label class="fl" for="pr-name">Pseudo</label>
        <div class="row" style="gap:6px;"><input id="pr-name" type="text" value="${esc(u.name)}"><button class="btn btn-s sm" id="pr-save" style="flex:0 0 auto;">Enregistrer</button></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="sv tnum">${h.length}</div><div class="sl">Parties</div></div>
      <div class="stat"><div class="sv tnum">${wins}</div><div class="sl">Victoires</div></div>
      <div class="stat"><div class="sv tnum">${avg}</div><div class="sl">Moyenne / volée</div></div>
      <div class="stat"><div class="sv tnum">${best}</div><div class="sl">Meilleure volée</div></div>
      <div class="stat"><div class="sv tnum">${c180}</div><div class="sl">Volées à 180</div></div>
      <div class="stat"><div class="sv tnum">${fr.length}</div><div class="sl">Amis</div></div>
    </div>

    <div class="card">
      <h3>Amis</h3>
      <div class="row" style="gap:6px;">
        <input id="pr-friend" type="text" placeholder="Pseudo du joueur à ajouter">
        <button class="btn btn-s sm" id="pr-add" style="flex:0 0 auto;">Ajouter</button>
      </div>
      ${fr.length? fr.map(f=>`
        <div class="frow">${avatarHTML(f,32)}
          <span><span class="fn">${esc(f.name)}</span><span class="fm">${esc(f.mail)}</span></span>
          <button class="btn-q fa" data-unfriend="${f.id}">Retirer</button>
        </div>`).join('')
      : `<p class="small">Ajoute un joueur par son pseudo pour voir ses parties dans l'onglet Amis.</p>`}
    </div>
  </div>`);

  if(ONLINE && !S.cache.friendsLoaded) loadFriends().then(render);
  root.querySelector('#pr-out').onclick = async ()=>{
    if(ONLINE && sb){ try{ await sb.auth.signOut(); }catch(e){} ME=null; S.cache={profiles:{},feed:[],friends:[],feedLoaded:false,friendsLoaded:false}; }
    save(K.session,null); S.match=null; stopCamera(); go('auth');
  };
  const file = root.querySelector('#pr-file');
  root.querySelector('#pr-photo').onclick = ()=>file.click();
  file.onchange = ()=>{
    const f = file.files && file.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 256, c = document.createElement('canvas');
        c.width=size; c.height=size;
        const x = c.getContext('2d');
        const s = Math.min(img.width,img.height);
        x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
        saveMe({photo:c.toDataURL('image/jpeg',0.82)})
          .then(()=>{ toast('Photo mise à jour.','good'); S.err=null; render(); })
          .catch(()=>{ toast("La photo n'a pas pu être enregistrée.",'bad'); render(); });
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
  const rm = root.querySelector('#pr-rmphoto');
  if(rm) rm.onclick = async ()=>{ await saveMe({photo:null}); render(); };
  root.querySelector('#pr-save').onclick = async ()=>{
    const v = root.querySelector('#pr-name').value.trim();
    if(v.length<2){ S.err='Le pseudo doit faire au moins 2 caractères.'; return render(); }
    try{
      if(ONLINE){
        const {data:taken} = await sb.from('profiles').select('id').ilike('name', v).maybeSingle();
        if(taken && taken.id!==u.id){ S.err='Ce pseudo est déjà pris.'; return render(); }
      } else if(load(K.users,[]).some(x=>x.id!==u.id && x.name.toLowerCase()===v.toLowerCase())){
        S.err='Ce pseudo est déjà pris.'; return render();
      }
      await saveMe({name:v});
      toast('Pseudo enregistré.','good'); S.err=null;
    }catch(e){ S.err="Le pseudo n'a pas pu être enregistré."; }
    render();
  };
  root.querySelector('#pr-add').onclick = async ()=>{
    const v = root.querySelector('#pr-friend').value.trim();
    if(!v) return;
    const r = await addFriendByName(v);
    if(r.ok) toast(r.ok,'good'); else toast(r.err,'bad');
    S.err = null; S.msg = null;
    render();
  };
  root.querySelectorAll('[data-unfriend]').forEach(b=>b.onclick=async ()=>{
    await removeFriend(b.dataset.unfriend);
    S.msg=null; S.err=null; render();
  });
  return root;
};

/* =========================================================
   RENDER
========================================================= */
function render(){
  const app = document.getElementById('app');
  const navEl = document.getElementById('nav');
  if(S.view!=='auth' && !me()) S.view='auth';
  const view = V[S.view] || V.home;
  app.innerHTML = '';
  app.appendChild(view());

  paintNavLogo();
  const showNav = ['home','feed','profile'].includes(S.view);
  const tz = document.getElementById('toasts');
  if(tz) tz.style.bottom = showNav ? 'calc(78px + env(safe-area-inset-bottom))' : 'calc(20px + env(safe-area-inset-bottom))';
  navEl.classList.toggle('hidden', !showNav);
  app.classList.toggle('pad-nav', showNav);
  navEl.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on', b.dataset.nav===S.view));

  if(S.view==='play'){
    renderConfirm();
    mountCamera();
    renderCamHint();
    keepAwake(true);
    turnFlash();
  } else {
    keepAwake(false);
  }
  if(S.view!==lastView){ window.scrollTo({top:0}); lastView = S.view; }
}
let lastView = null;
function paintNavLogo(){
  const l = document.getElementById('nav-logo');
  if(l && !l.src.startsWith('data:')) l.src = LOGO_ICON;
}
function mountCamera(){
  const slot = document.getElementById('cam-slot');
  if(!slot) return;
  slot.appendChild(ensureCamNode());
  if(S.camOn && video && !video.srcObject) S.camOn = false;
  setTimeout(()=>{ resizeOverlay(); drawOverlay(); }, 50);
  if(S.detecting) loopDetect();
}
function setupCanvas(){
  video = document.getElementById('video');
  ovC = document.getElementById('ov');
  if(!video || !ovC) return;
  ovX = ovC.getContext('2d');
  if(!wkC){ wkC = document.createElement('canvas'); wkX = wkC.getContext('2d'); }
  const resize = ()=>{
    const r = video.getBoundingClientRect();
    if(!r.width) return;
    ovC.width = r.width; ovC.height = r.height;
    drawOverlay();
  };
  video.addEventListener('loadedmetadata', resize);
  window.addEventListener('resize', resize);
  setTimeout(resize, 200);
  ovC.addEventListener('click', onBoardTap);
  ovC.addEventListener('touchstart', e=>{ e.preventDefault(); onBoardTap(e); }, {passive:false});
  if(S.camOn && !video.srcObject) S.camOn = false;
}

document.getElementById('nav').querySelectorAll('[data-nav]').forEach(b=>{
  b.onclick = ()=>go(b.dataset.nav);
});

async function boot(){
  S.view = 'auth';
  render();
  await connectSupabase();
  if(ONLINE){
    await handleAuthReturn();
    try{
      const {data} = await sb.auth.getSession();
      if(data && data.session) await adoptSession(data.session.user);
    }catch(e){}
    sb.auth.onAuthStateChange(async (evt, session)=>{
      if(evt==='SIGNED_OUT'){ ME=null; if(S.view!=='auth') go('auth'); }
    });
  }
  S.view = me()? 'home' : 'auth';
  render();
  if(ONLINE && ME) refreshCaches();
}
boot();
</script>
