<meta name="format-detection" content="telephone=no">
<title>KIVO</title>
<style>
:root{
  /* palette Kivo */
  --bg:#0D1017;          /* noir bleuté */
  --surface:#171B24;     /* cartes, panneaux, menus */
  --surface-2:#1C2130;
  --surface-3:#232838;
  --line:#2C3242;
  --line-soft:#1F2431;
  --text:#F1F2F4;        /* blanc légèrement froid */
  --text-2:#A3AAB8;
  --muted:#6D7688;
  --accent:#7C5CFC;      /* violet signature */
  --accent-hi:#9179FF;
  --accent-dim:#241C4A;
  --good:#8FD694;        /* vert frais */
  --good-dim:#1D3326;
  --warn:#E0B25C;
  --bad:#E8737A;
  --r:4px;
  --font:Arial, "Helvetica Neue", Helvetica, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:15px;
  line-height:1.45;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:var(--font);font-size:15px;color:var(--text);}
button{cursor:pointer;border:none;background:none;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;}
.tnum{font-variant-numeric:tabular-nums;}

/* shell */
.shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.view{flex:1;padding:20px 18px 26px;display:flex;flex-direction:column;gap:18px;}
.view.pad-nav{padding-bottom:96px;}

/* type */
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0;}
h1{font-size:26px;font-weight:bold;letter-spacing:-.01em;margin:0;text-wrap:balance;}
h2{font-size:17px;font-weight:bold;margin:0;letter-spacing:-.005em;}
h3{font-size:13px;font-weight:bold;margin:0;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);}
p{margin:0;}
.lede{color:var(--text-2);font-size:14px;max-width:60ch;}
.small{font-size:12.5px;color:var(--muted);}
.err{font-size:13px;color:var(--bad);background:var(--accent-dim);border-left:2px solid var(--bad);padding:9px 11px;}
.ok-msg{font-size:13px;color:var(--good);border-left:2px solid var(--good);padding:9px 11px;background:#12211610;}

/* brand */
.brand{display:flex;align-items:center;gap:11px;}
.mark{width:38px;height:38px;background:var(--accent);color:#0D1017;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;letter-spacing:-.03em;flex:0 0 auto;}
.mark.sm{width:28px;height:28px;font-size:11px;}
.brand-name{font-size:19px;font-weight:bold;letter-spacing:.02em;}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line-soft);padding:16px;display:flex;flex-direction:column;gap:12px;}
.card.tight{padding:13px;gap:9px;}
.stack{display:flex;flex-direction:column;gap:12px;}
.stack.sm{gap:8px;}
.row{display:flex;gap:9px;}
.row > *{flex:1;}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.rule{height:1px;background:var(--line-soft);}

/* form */
label.fl{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
input[type=text],input[type=email],input[type=password],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;color:var(--text);
}
textarea{resize:vertical;min-height:70px;line-height:1.4;}
input::placeholder,textarea::placeholder{color:#565E66;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:var(--r);font-weight:bold;font-size:14.5px;letter-spacing:.01em;transition:background .12s ease,border-color .12s ease;}
.btn-p{background:var(--accent);color:#0D1017;font-weight:bold;}
.btn-p:hover{background:var(--accent-hi);}
.btn-p:disabled{background:var(--surface-3);color:var(--muted);cursor:not-allowed;}
.btn-s{background:var(--surface-2);border:1px solid var(--line);color:var(--text);}
.btn-s:hover{border-color:var(--muted);}
.btn-s:disabled{color:var(--muted);cursor:not-allowed;}
.btn-q{background:none;color:var(--text-2);font-weight:normal;padding:9px 6px;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;}
.btn-q:hover{color:var(--text);}
.btn.wide{width:100%;}
.btn.sm{padding:9px 12px;font-size:13px;}
.btn-danger{background:none;border:1px solid #3C2732;color:var(--bad);}

/* menu tiles */
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line-soft);padding:15px;transition:border-color .12s ease,background .12s ease;}
.tile:hover{border-color:var(--line);background:var(--surface-2);}
.tile.primary{border-color:#33296B;background:linear-gradient(180deg,#1B1836,var(--surface));}
.tile .ti{width:34px;height:34px;flex:0 0 auto;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:bold;font-size:12px;letter-spacing:-.02em;}
.tile.primary .ti{background:var(--accent);border-color:var(--accent);color:#0D1017;}
.tile .tt{font-weight:bold;font-size:15px;display:block;}
.tile .td{font-size:12.5px;color:var(--muted);margin-top:2px;display:block;}
.tile .tc{margin-left:auto;color:var(--muted);font-size:18px;}

/* avatar */
.av{border-radius:50%;background:var(--surface-3);border:1px solid var(--line);object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:bold;color:var(--text-2);flex:0 0 auto;overflow:hidden;}
.av-32{width:32px;height:32px;font-size:12px;}
.av-40{width:40px;height:40px;font-size:14px;}
.av-72{width:72px;height:72px;font-size:24px;}
img.av{display:block;}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:#0E0F11;border-top:1px solid var(--line-soft);}
.nav-in{max-width:480px;margin:0 auto;display:flex;}
.nav button{flex:1;padding:12px 0 16px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.nav button .ni{width:18px;height:18px;border:1.5px solid currentColor;}
.nav button .ni.circle{border-radius:50%;}
.nav button .ni.feed{border:none;display:flex;flex-direction:column;justify-content:space-between;}
.nav button .ni.feed i{display:block;height:2px;background:currentColor;}
.nav button.on{color:var(--accent);}

/* scoreboard */
.sb{display:grid;gap:8px;}
.sb.c2{grid-template-columns:1fr 1fr;}
.sb.c3{grid-template-columns:1fr 1fr 1fr;}
.sb.c4{grid-template-columns:1fr 1fr;}
.ptile{background:var(--surface);border:1px solid var(--line-soft);padding:12px 12px 11px;position:relative;}
.ptile.act{border-color:var(--good);background:linear-gradient(180deg,#182318,var(--surface));}
.ptile .pn{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.ptile.act .pn{color:var(--text);}
.ptile .ps{font-size:36px;font-weight:bold;line-height:1;letter-spacing:-.03em;}
.sb.c3 .ptile .ps,.sb.c4 .ptile .ps{font-size:30px;}
.ptile .pmeta{font-size:11px;color:var(--muted);margin-top:6px;min-height:15px;}
.ptile .turnbar{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--good);}
.bot-tag{font-size:9px;letter-spacing:.1em;border:1px solid var(--line);padding:1px 4px;color:var(--muted);text-transform:uppercase;}

/* darts row */
.darts{display:flex;gap:8px;}
.dslot{flex:1;height:52px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:bold;color:var(--muted);background:var(--surface);}
.dslot.on{border-style:solid;border-color:var(--accent);color:var(--text);}
.dslot.zero{border-color:#3C2732;color:var(--bad);}
.miss-lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:bold;}
.kp button.miss{color:var(--bad);border-color:#3C2732;}

/* keypad */
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.kp button{padding:12px 0;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);font-size:14px;font-weight:bold;}
.kp button:hover{border-color:var(--line);}
.kp button.wide2{grid-column:span 2;}
.mults{display:flex;gap:6px;}
.mults button{flex:1;padding:10px 0;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);}
.mults button.sel{background:var(--accent);border-color:var(--accent);color:#0D1017;font-weight:bold;}

/* camera */
.cam{position:relative;background:#000;border:1px solid var(--line);overflow:hidden;touch-action:none;}
.cam .zoomer{position:relative;width:100%;aspect-ratio:1/1;transform-origin:center center;will-change:transform;}
video{width:100%;height:100%;display:block;object-fit:cover;background:#000;}
.cam.big .zoomer{aspect-ratio:auto;height:min(62vh,520px);}

/* plein écran de comptage */
.cam-full{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;}
.cam-full #fs-slot{flex:1;display:flex;min-height:0;}
.cam-full .cam{flex:1;border:none;min-height:0;}
.cam-full .zoomer{width:100%;height:100%;aspect-ratio:auto;}
.cam-full video{height:100%;object-fit:contain;}
.cam-full .cam-target,.cam-full .cam-hint{display:none;}
.cam-full .cam-score{top:calc(58px + env(safe-area-inset-top));}
.cam-full .fs-top{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(180deg,rgba(13,16,23,.92),transparent);z-index:2;}
.cam-full .fs-bottom{position:relative;padding:10px 10px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(13,16,23,.94),transparent);display:flex;flex-direction:column;gap:10px;z-index:2;}
.fs-score{display:flex;gap:8px;}
.fs-p{flex:1;background:rgba(23,27,36,.9);border:1px solid var(--line);padding:7px 10px;}
.fs-p.act{border-color:var(--good);}
.fs-p .n{font-size:11px;color:var(--text-2);}
.fs-p .v{font-size:22px;font-weight:bold;line-height:1.1;}
.fs-darts{display:flex;gap:6px;}
.fs-darts div{flex:1;text-align:center;padding:8px 0;border:1px dashed var(--line);font-weight:bold;font-size:14px;color:var(--muted);background:rgba(23,27,36,.85);}
.fs-darts div.on{border-style:solid;border-color:var(--accent);color:var(--text);}
.fs-darts div.zero{border-color:#3C2732;color:var(--bad);font-size:11px;letter-spacing:.08em;}
.zoom-row{display:flex;align-items:center;gap:10px;}
.zoom-row input[type=range]{flex:1;accent-color:var(--accent);height:32px;}
.zoom-val{font-size:12px;color:var(--text-2);min-width:38px;text-align:right;}
canvas.ov{position:absolute;inset:0;width:100%;height:100%;}
.cam-badge{position:absolute;top:9px;left:9px;display:inline-flex;align-items:center;gap:6px;background:rgba(13,16,23,.85);border:1px solid var(--line);padding:4px 9px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.cam-badge.on{color:var(--good);}
.cam-badge .d{width:6px;height:6px;border-radius:50%;background:currentColor;}
.cam-hint{position:absolute;left:9px;right:9px;bottom:9px;background:rgba(13,16,23,.9);border:1px solid var(--line);padding:8px 10px;font-size:12.5px;line-height:1.35;}
.cam-hint a{color:var(--accent-hi);cursor:pointer;text-decoration:underline;}

/* detect confirm */
.confirm{border:1px solid var(--good);background:linear-gradient(180deg,#161f19,var(--surface));padding:14px;display:flex;flex-direction:column;gap:11px;}
.confirm .cv{font-size:24px;font-weight:bold;letter-spacing:-.02em;}
.confirm .cv em{font-style:normal;color:var(--muted);font-size:14px;font-weight:normal;}

/* log */
.log-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
.log-row:last-child{border-bottom:none;}
.log-row .lp{color:var(--text-2);}
.log-row .lv{font-weight:bold;}
.log-row.bust .lv{color:var(--bad);}

/* feed */
.post{background:var(--surface);border:1px solid var(--line-soft);padding:14px;display:flex;flex-direction:column;gap:11px;}
.post-head{display:flex;align-items:center;gap:10px;}
.post-head .pu{font-weight:bold;font-size:14px;}
.post-head .pt{font-size:11.5px;color:var(--muted);}
.post-body{font-size:14px;color:var(--text-2);}
.result-box{border:1px solid var(--line);background:var(--bg);}
.result-line{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
.result-line:last-child{border-bottom:none;}
.result-line.win{color:var(--text);font-weight:bold;}
.result-line.win .rn::before{content:"";display:inline-block;width:6px;height:6px;background:var(--good);margin-right:8px;vertical-align:middle;}
.result-line .rn{color:var(--text-2);}
.result-line.win .rn{color:var(--text);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:3px 8px;color:var(--muted);}
.post-actions{display:flex;gap:6px;border-top:1px solid var(--line-soft);padding-top:10px;}
.post-actions button{flex:1;padding:7px 0;font-size:12.5px;color:var(--text-2);border:1px solid transparent;}
.post-actions button:hover{border-color:var(--line);}
.post-actions button.liked{color:var(--accent);font-weight:bold;}
.comment{display:flex;gap:8px;font-size:13px;padding-top:8px;}
.comment b{font-weight:bold;}
.comment span{color:var(--text-2);}
.tabs{display:flex;border:1px solid var(--line-soft);background:var(--surface);}
.tabs button{flex:1;padding:10px 0;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.tabs button.on{background:var(--surface-3);color:var(--text);font-weight:bold;}

/* players setup */
.prow{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line-soft);padding:10px;}
.prow input{flex:1;padding:9px 10px;}
.prow select{width:132px;padding:9px 8px;font-size:13.5px;}
.prow .rm{color:var(--muted);font-size:18px;padding:0 6px;}
.prow .rm:hover{color:var(--bad);}

/* code display */
.code-box{border:1px solid var(--line);background:var(--surface);padding:20px;text-align:center;}
.code-box .cd{font-size:38px;font-weight:bold;letter-spacing:.22em;padding-left:.22em;}
.code-box .cl{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}

/* stats grid */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);}
.stat{background:var(--surface);padding:13px;}
.stat .sv{font-size:22px;font-weight:bold;letter-spacing:-.02em;}
.stat .sl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px;}

/* friends */
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.frow:last-child{border-bottom:none;}
.frow .fn{font-weight:bold;font-size:14px;display:block;}
.frow .fm{font-size:12px;color:var(--muted);display:block;}
.frow .fa{margin-left:auto;}

/* win banner */
.win{border:1px solid var(--good);background:linear-gradient(180deg,#16211a,var(--surface));padding:22px;text-align:center;}
.win .wl{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--good);}
.win .wn{font-size:30px;font-weight:bold;letter-spacing:-.02em;margin-top:6px;}
.win .ws{font-size:13px;color:var(--muted);margin-top:4px;}

.empty{border:1px dashed var(--line);padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px;}
.hidden{display:none !important;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}

/* surcouches lisibles par-dessus la caméra */
.cam-score{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;z-index:3;pointer-events:none;}
.cam-score .cs{flex:1;background:rgba(13,16,23,.88);border:1px solid var(--line);padding:6px 9px;}
.cam-score .cs.act{border-color:var(--good);}
.cam-score .cs .n{font-size:10.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cam-score .cs .v{font-size:20px;font-weight:bold;line-height:1.15;}
.cam-aim{position:absolute;left:8px;bottom:8px;background:rgba(13,16,23,.88);border:1px solid var(--line);
  padding:5px 9px;font-size:11.5px;color:var(--text-2);z-index:3;pointer-events:none;}
.read{position:absolute;left:8px;right:8px;bottom:8px;z-index:4;background:rgba(13,16,23,.95);
  border:1px solid var(--good);padding:12px;display:flex;flex-direction:column;gap:10px;}
.read .rl{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--good);}
.read .rv{font-size:34px;font-weight:bold;line-height:1;letter-spacing:-.02em;}
.read .rv em{font-style:normal;font-size:15px;font-weight:normal;color:var(--text-2);margin-left:8px;}
.read .row{display:flex;gap:8px;}
.fix{position:absolute;inset:8px;z-index:5;background:rgba(13,16,23,.97);border:1px solid var(--line);
  padding:12px;display:flex;flex-direction:column;gap:9px;overflow:auto;}
.fix h4{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);}
.fix .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.fix .grid button{padding:11px 0;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);font-weight:bold;font-size:14px;}
.fix .grid button.sel{background:var(--accent);border-color:var(--accent);color:#0D1017;}
.calib-tip{position:absolute;left:8px;right:8px;top:8px;z-index:4;background:rgba(13,16,23,.92);
  border:1px solid var(--good);padding:9px 11px;font-size:12.5px;line-height:1.35;}

/* réglages caméra */
.btn.on-tool{border-color:var(--accent);color:var(--text);}

/* logo */
.logo-hero{width:186px;height:auto;display:block;}
.tagline{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--good);margin-top:2px;}
.logo-head{height:30px;width:auto;display:block;}
.logo-nav{height:19px;width:auto;opacity:.55;}
.nav button.on .logo-nav{opacity:1;}

/* toasts */
.toasts{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));transition:bottom .15s ease;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:60;padding:0 16px;}
.toast{background:var(--surface-3);border:1px solid var(--line);color:var(--text);padding:11px 15px;border-radius:var(--r);font-size:13.5px;max-width:440px;width:100%;
  box-shadow:0 10px 30px rgba(0,0,0,.45);animation:toast-in .18s ease-out;}
.toast.good{border-color:var(--good-dim);}
.toast.bad{border-color:#3C2732;}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* modale */
.modal-bg{position:fixed;inset:0;background:rgba(6,7,8,.78);display:flex;align-items:center;justify-content:center;padding:24px;z-index:70;}
.modal{background:var(--surface);border:1px solid var(--line);max-width:380px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;}
.modal h2{font-size:17px;}
.modal p{font-size:14px;color:var(--text-2);}

/* bandeau de tour */
.turn-flash{position:fixed;left:0;right:0;top:0;background:var(--good);color:#0D1017;text-align:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;font-size:13.5px;font-weight:bold;z-index:65;animation:flash-in .2s ease-out;}
@keyframes flash-in{from{transform:translateY(-100%);}to{transform:none;}}

/* mobile */
html{-webkit-text-size-adjust:100%;}
body{overscroll-behavior-y:none;}
.shell{min-height:100vh;min-height:100dvh;}
button,.tile,.dslot{touch-action:manipulation;}
input[type=text],input[type=email],input[type=password],select,textarea{font-size:16px;}
.view{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:max(18px,env(safe-area-inset-top));}
.view.pad-nav{padding-bottom:calc(104px + env(safe-area-inset-bottom));}
.nav{padding-bottom:env(safe-area-inset-bottom);}
.nav button{min-height:56px;}
.btn{min-height:48px;}
.btn.sm{min-height:42px;}
.btn-q{min-height:40px;}
.kp button{min-height:48px;font-size:15px;}
.mults button{min-height:42px;}
.prow .rm{min-width:34px;min-height:34px;}
.cam-tools{display:flex;gap:8px;}
.cam-tools .btn{flex:1;}
.cam-line{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cam-target{position:absolute;top:9px;right:9px;background:rgba(13,16,23,.85);border:1px solid var(--line);padding:4px 9px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);border:1px solid var(--line);padding:8px 11px;border-radius:var(--r);background:var(--surface-2);min-height:40px;}
.switch.on{border-color:var(--accent);color:var(--text);}
.switch .led{width:8px;height:8px;border-radius:50%;background:var(--muted);}
.switch.on .led{background:var(--good);}
@media (max-width:359px){
  .kp{grid-template-columns:repeat(4,1fr);}
  .ptile .ps{font-size:30px;}
}
@media (min-width:600px){
  .shell{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);}
}
</style>

<body>

<div class="shell">
  <div class="view" id="app"></div>
  <div class="toasts" id="toasts"></div>
  <nav class="nav hidden" id="nav">
    <div class="nav-in">
      <button data-nav="home"><img src="" alt="" class="logo-nav" id="nav-logo">Jouer</button>
      <button data-nav="feed"><span class="ni feed"><i></i><i></i><i></i></span>Fil</button>
      <button data-nav="profile"><span class="ni circle"></span>Profil</button>
    </div>
  </nav>
</div>

<script>
/* =========================================================
   KIVO — Join the Dart Side
   App fléchettes : comptes, modes de jeu, caméra, fil, amis.
   Stockage local (localStorage). Un backend prend le relais
   pour le multi entre appareils.
========================================================= */

/* ---------- storage ---------- */
const K = {users:'d180.users', session:'d180.session', feed:'d180.feed', rooms:'d180.rooms', hist:'d180.hist', calib:'d180.calib', camPref:'d180.campref', sens:'d180.sens', zoom:'d180.zoom'};
function load(k, d){ try{ const v = localStorage.getItem(k); return v? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,10); }
function now(){ return Date.now(); }

/* ---------- board geometry ---------- */
const SECTORS = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const R_DBULL=0.0374, R_BULL=0.0935, R_TRI_IN=0.582, R_TRI_OUT=0.629, R_DBL_IN=0.953, R_DBL_OUT=1.06;
const CAL_TARGETS = [[0,1],[1,0],[0,-1],[-1,0]];
const CAL_LABELS = ['20, en haut','6, à droite','3, en bas','11, à gauche'];

function solveLinear(A,B){
  const n=B.length, M=A.map((r,i)=>[...r,B[i]]);
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    [M[c],M[p]]=[M[p],M[c]];
    const pv=M[c][c]; if(Math.abs(pv)<1e-9) continue;
    for(let j=c;j<=n;j++) M[c][j]/=pv;
    for(let r=0;r<n;r++){ if(r===c) continue; const f=M[r][c]; if(!f) continue; for(let j=c;j<=n;j++) M[r][j]-=f*M[c][j]; }
  }

function solveHomography(src,dst){
  const A=[],B=[];
  for(let i=0;i<4;i++){

    A.push([x,y,1,0,0,0,-x*X,-y*X]); B.push(X);
    A.push([0,0,0,x,y,1,-x*Y,-y*Y]); B.push(Y);

function dartOf(mult,num){
  if(num===0||mult===0) return {value:0,label:'Manqué',mult:0,num:0};
  if(num===25) return mult===2? {value:50,label:'D-BULL',mult:2,num:25} : {value:25,label:'BULL',mult:1,num:25};
  const p = mult===3?'T':mult===2?'D':'S';
  return {value:num*mult,label:p+num,mult,num};
}

const SUPABASE_URL = 'https://mgadqvqscrwlhibbzuqu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_d2u535y1xlG4NDVXfw1rTA_Wje_KCod';

let sb = null;        // client Supabase
let ONLINE = false;   // serveur joignable
let ME = null;        // profil connecté {id,name,photo,mail}

async function connectSupabase(){
  if(!SUPABASE_URL || !SUPABASE_KEY) return false;
  try{
    const mod = await import('https://esm.sh/@supabase/supabase-js@2');
    sb = mod.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
    ONLINE = true;
  }catch(e){ ONLINE = false; }
  return ONLINE;
}
async function ensureProfile(user){
  const {data} = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if(data) return data;
  const wanted = (user.user_metadata && user.user_metadata.name) || ('joueur'+user.id.slice(0,4));
  const {data:made, error} = await sb.from('profiles').insert({id:user.id, name:wanted}).select().single();
  if(error){
    const {data:retry} = await sb.from('profiles').insert({id:user.id, name:wanted+'-'+user.id.slice(0,4)}).select().single();
    return retry;
  }
  return made;
}
async function adoptSession(user){
  const prof = await ensureProfile(user);
  ME = prof ? {...prof, mail:user.email} : null;
  return ME;
}
function me(){
  if(ONLINE) return ME;
  const id = load(K.session, null);
  return id ? load(K.users,[]).find(u=>u.id===id) || null : null;
}
async function saveMe(patch){
  if(ONLINE && ME){
    const {data,error} = await sb.from('profiles').update(patch).eq('id', ME.id).select().single();
    if(error) throw error;
    ME = {...ME, ...data};
    return ME;
  }
  const all = load(K.users,[]); const i = all.findIndex(u=>u.id===load(K.session,null));
  if(i<0) return null;
  all[i] = {...all[i], ...patch}; save(K.users, all); return all[i];
}
function userById(id){
  if(ONLINE) return (S.cache.profiles||{})[id] || (ME && ME.id===id? ME : null);
  return load(K.users,[]).find(u=>u.id===id) || null;
}
function cacheProfiles(list){
  S.cache.profiles = S.cache.profiles || {};
  (list||[]).forEach(p=>{ if(p && p.id) S.cache.profiles[p.id]=p; });
}
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

/* ---------- retours utilisateur ---------- */
function toast(text, kind){
  const box = document.getElementById('toasts');
  if(!box) return;
  const t = el(`<div class="toast ${kind||''}">${esc(text)}</div>`);
  box.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .25s'; t.style.opacity='0'; setTimeout(()=>t.remove(), 260); }, 2600);
}
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

function ask(title, text, confirmLabel){
  return new Promise(resolve=>{
    const bg = el(`<div class="modal-bg">
      <div class="modal" role="dialog" aria-modal="true">
        <h2>${esc(title)}</h2>
        <p>${esc(text)}</p>
        <div class="row">
          <button class="btn btn-s" id="mk-no">Annuler</button>
          <button class="btn btn-p" id="mk-yes">${esc(confirmLabel||'Confirmer')}</button>
        </div>
      </div>
    </div>`);
    const close = v=>{ bg.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e=>{ if(e.key==='Escape') close(false); };
    bg.querySelector('#mk-no').onclick = ()=>close(false);
    bg.querySelector('#mk-yes').onclick = ()=>close(true);
    bg.onclick = e=>{ if(e.target===bg) close(false); };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(bg);
    bg.querySelector('#mk-yes').focus();
  });
}

/* garder l'écran allumé pendant une partie */
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); }
    else if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ wakeLock = null; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && S.view==='play' && !wakeLock) keepAwake(true);
});

/* bandeau quand le tour arrive */
let lastTurnKey = null;
function turnFlash(){
  const m = S.match;
  if(!m || m.winner){ lastTurnKey=null; return; }
  const key = m.id+':'+m.turn+':'+m.round;
  if(key===lastTurnKey) return;
  lastTurnKey = key;
  if(!canPlay() || m.players.length<2) return;
  const old = document.querySelector('.turn-flash'); if(old) old.remove();
  const f = el(`<div class="turn-flash">À toi de jouer, ${esc(cur().name)}</div>`);
  document.body.appendChild(f);
  buzz(30);
  setTimeout(()=>{ f.style.transition='opacity .3s'; f.style.opacity='0'; setTimeout(()=>f.remove(),320); }, 1500);
}

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function avatarHTML(u, size){
  const cls = 'av av-'+size;
  if(u && u.photo) return `<img class="${cls}" src="${u.photo}" alt="">`;

function makePlayer(cfg, mode, conf){
  const p = {
    id: uid(), uid: cfg.uid||null, name: cfg.name, photo: cfg.photo||null,
    isBot: !!cfg.isBot, skill: cfg.skill||0.55,
    legs:0, darts:0, totalScored:0, best:0, count180:0
  };
  if(mode==='x01') p.score = conf.start;
  if(mode==='cricket'){ p.marks={}; CRICKET_TARGETS.forEach(t=>p.marks[t]=0); p.points=0; }
  if(mode==='clock') p.target = 1;
  if(mode==='shanghai') p.points = 0;
  if(mode==='topscore') p.points = 0;
  return p;
}
function newMatch(setup){
  const conf = setup.conf;
  return {
    id: uid(), mode: setup.mode, conf, context: setup.context||'local',
    players: setup.players.map(p=>makePlayer(p, setup.mode, conf)),
    turn:0, round:0, throws:[], log:[], winner:null, startedAt: now(), shared:false
  };
}
function cur(){ return S.match.players[S.match.turn]; }
function isBotTurn(){ return S.match && !S.match.winner && cur().isBot; }
function canPlay(){
  const m = S.match;
  if(!m || m.winner) return false;
  const p = cur();
  if(p.isBot) return false;
  if(m.context==='online') return p.uid === (me()||{}).id;
  return true;
}

/* ---------- add / undo dart ---------- */
function addDart(mult,num){
  const m = S.match;
  if(!m || m.winner || m.throws.length>=3) return;
  const d = dartOf(mult,num);
  m.throws.push(d);
  S.pending = null;
  S.pick.mult = 1;
  buzz(12);
  if(m.context==='online') pushMatch();
  if(m.throws.length>=3){ render(); setTimeout(resolveTurn, 380); }
  else render();
}
function undoDart(){
  const m=S.match; if(!m||m.winner) return;
  m.throws.pop(); S.pending=null;

/* ---------- resolve turn ---------- */
function resolveTurn(){
  const m = S.match;
  if(!m || m.winner) return;
  const p = cur();
  const darts = m.throws.slice();
  const turnTotal = darts.reduce((s,d)=>s+d.value,0);
  p.darts += darts.length;
  let entry = {name:p.name, text: darts.map(d=>d.label).join(' · ') || 'aucun jet', bust:false, val:''};
  let win = false;

  if(m.mode==='x01'){
    const start = p.score;
    let rem = start - turnTotal;
    const last = darts[darts.length-1];
    let bust = rem<0 || (m.conf.doubleOut && rem===1);
    if(rem===0){
      if(!m.conf.doubleOut || (last && last.mult===2)) win = true;
      else bust = true;
    }
    if(bust){ entry.bust=true; entry.text += ' · bust'; entry.val = String(start); }
    else {
      p.score = rem; p.totalScored += turnTotal;
      if(turnTotal>p.best) p.best = turnTotal;
      if(turnTotal===180) p.count180++;
      entry.val = String(rem);
    }
  }

  else if(m.mode==='cricket'){
    let gained = 0;
    darts.forEach(d=>{
      if(!CRICKET_TARGETS.includes(d.num)) return;
      let hits = d.mult;
      const need = Math.max(0, 3 - p.marks[d.num]);
      const toMark = Math.min(need, hits);
      p.marks[d.num] += toMark;
      const extra = hits - toMark;
      if(extra>0){
        const closedByAll = m.players.every(q=>q.marks[d.num]>=3);
        if(!closedByAll){ p.points += extra*d.num; gained += extra*d.num; }
      }
    });
    p.totalScored += turnTotal;
    if(turnTotal>p.best) p.best = turnTotal;
    entry.val = gained? '+'+gained : '—';
    const allClosed = CRICKET_TARGETS.every(t=>p.marks[t]>=3);
    const topPoints = Math.max(...m.players.filter(q=>q!==p).map(q=>q.points));
    if(allClosed && p.points>=topPoints) win = true;
  }

  else if(m.mode==='clock'){
    let advanced = 0;
    darts.forEach(d=>{
      const tgt = p.target>20 ? 25 : p.target;
      if(d.num===tgt){ p.target++; advanced++; }
    });
    p.totalScored += turnTotal;
    entry.val = advanced? '+'+advanced : '—';
    if(p.target>21) win = true;
  }

  else if(m.mode==='shanghai'){
    const tgt = m.round+1;
    let gained = 0, mults = new Set();
    darts.forEach(d=>{ if(d.num===tgt){ gained += d.value; mults.add(d.mult); } });
    p.points += gained; p.totalScored += turnTotal;
    if(turnTotal>p.best) p.best = turnTotal;
    entry.val = gained? '+'+gained : '—';
    if(mults.has(1)&&mults.has(2)&&mults.has(3)){ win = true; entry.text += ' · shanghai'; }
  }

  else if(m.mode==='topscore'){
    p.points += turnTotal; p.totalScored += turnTotal;
    if(turnTotal>p.best) p.best = turnTotal;
    if(turnTotal===180) p.count180++;
    entry.val = String(p.points);
  }

  m.log.unshift(entry);
  if(m.log.length>50) m.log.pop();
  m.throws = [];

  if(win){ finishLeg(p); return; }

  m.turn = (m.turn+1) % m.players.length;
  if(m.context==='online') pushMatch();
  if(m.turn===0){
    m.round++;
    if(m.mode==='shanghai' && m.round>=m.conf.rounds) return endOnPoints();
    if(m.mode==='topscore' && m.players.every(q=>q.darts>=m.conf.turns*3)) return endOnPoints();
  }
  render();
  maybeBot();
}

function endOnPoints(){
  const m = S.match;
  const top = Math.max(...m.players.map(p=>p.points));
  const winner = m.players.find(p=>p.points===top);
  finishLeg(winner);
}

function finishLeg(p){
  const m = S.match;
  p.legs++;
  const target = m.conf.legs || 1;
  if(m.mode==='x01' && p.legs < target){
    m.players.forEach(q=>q.score = m.conf.start);
    m.throws = [];
    m.turn = (m.players.indexOf(p)+1) % m.players.length;
    m.log.unshift({name:p.name, text:'remporte la manche', bust:false, val:p.legs+'/'+target});
    if(m.context==='online') pushMatch();
    render();
    maybeBot();
    return;
  }
  m.winner = p.id;
  m.endedAt = now();
  buzz([40,60,120]);
  keepAwake(false);
  if(m.context==='online') pushMatch();
  stopSync();
  saveHistory(m);
  S.detecting = false;
  go('end');
}

function saveHistory(m){
  const u = me(); if(!u) return;
  const h = load(K.hist, []);
  const mine = m.players.find(p=>p.uid===u.id);
  h.unshift({
    id:m.id, mode:m.mode, at:m.endedAt, won: m.winner===(mine&&mine.id),
    best: mine? mine.best:0, avg: mine&&mine.darts? +(mine.totalScored/mine.darts*3).toFixed(1):0,
    c180: mine? mine.count180:0
  });
  save(K.hist, h.slice(0,200));
}

/* ---------- bot ---------- */
function maybeBot(){
  if(botTimer) clearTimeout(botTimer);
  if(!isBotTurn()) return;
  // en ligne, seul l'appareil de l'hôte fait jouer l'ordinateur
  if(S.match.context==='online' && S.match.hostId !== (me()||{}).id) return;
  botTimer = setTimeout(botThrow, 900);
}
function botThrow(){
  const m = S.match;
  if(!m || m.winner || !isBotTurn()) return;
  const p = cur();
  const d = botDart(m,p);
  m.throws.push(d);
  if(m.context==='online') pushMatch();
  render();
  if(m.throws.length>=3) botTimer = setTimeout(resolveTurn, 700);
  else botTimer = setTimeout(botThrow, 800);
}
/* dispersion du lancer, en fraction du rayon de la cible */
// calibré au banc d'essai : moyennes 3 fléchettes d'environ 40, 60 et 85,
// avec 2 volées à 180 pour 100 au niveau dur
const BOT_SIGMA = {easy:0.20, mid:0.10, hard:0.062};
function botSigma(p){
  if(p.skill<=0.4) return BOT_SIGMA.easy;
  if(p.skill<0.7) return BOT_SIGMA.mid;
  return BOT_SIGMA.hard;
}
function gauss(){
  let u=0,v=0;
  while(!u) u=Math.random();
  while(!v) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
/* première fléchette d'un finish connu, ex. "T20 D20" -> T20 */
function firstOfCheckout(txt){
  if(!txt) return null;
  const tok = txt.split(' ')[0];
  const m = tok.match(/^([TDS]?)(\d+)$/);
  if(!m) return null;
  const num = +m[2];
  const mult = m[1]==='T'?3 : m[1]==='D'?2 : 1;
  if(num===25) return {mult: m[1]==='D'?2:1, num:25};
  return {mult, num};
}
function botAim(m,p){
  if(m.mode==='x01'){
    const rem = p.score - m.throws.reduce((s,d)=>s+d.value,0);
    const left = 3 - m.throws.length;
    if(rem<=1) return {mult:3,num:20};                       // déjà bust, on jette au 20
    if(m.conf.doubleOut){
      if(rem<=40 && rem%2===0) return {mult:2, num:rem/2};    // double direct
      if(rem===50) return {mult:2, num:25};
      if(rem<=170){
        const co = firstOfCheckout(CHECKOUTS[rem]);
        if(co && left>=String(CHECKOUTS[rem]).split(' ').length) return co;
        if(co && left>=2) return co;
      }
      if(rem<=60 && rem%2===1) return {mult:1, num:Math.max(1, rem-32)}; // se laisser un pair
    } else {
      if(rem<=20) return {mult:1, num:rem};
      if(rem<=40 && rem%2===0) return {mult:2, num:rem/2};
      if(rem<=60) return {mult:1, num:20};
    }
    return {mult:3, num:20};
  }
  if(m.mode==='cricket'){
    const open = openTargets(m).filter(t=>p.marks[t]<3);
    const t = open.length? open[0] : (openTargets(m)[0]||20);
    return t===25 ? {mult:1,num:25} : {mult:3, num:t};
  }
  if(m.mode==='clock') return p.target>20 ? {mult:1,num:25} : {mult:1, num:p.target};
  if(m.mode==='shanghai') return {mult:3, num:m.round+1};
  return {mult:3, num:20};
}
/* le lancer : on vise un point, on ajoute une erreur gaussienne,
   et le score sort de la géométrie réelle de la cible. Un 20 manqué
   tombe donc naturellement dans le 5 ou le 1, parfois en triple. */
function botDart(m,p){
  const aim = botAim(m,p);
  const [ax,ay] = aimPoint(aim.mult, aim.num);
  const sigma = botSigma(p);
  let x = ax + gauss()*sigma;
  let y = ay + gauss()*sigma;
  // les faibles ratent parfois complètement la cible
  if(Math.hypot(x,y) > R_DBL_OUT*1.25 && Math.random()<0.5) return dartOf(0,0);
  return scoreOnBoard(x,y);
}

/* zoom d'affichage : la vidéo et l'overlay sont agrandis ensemble,
   le calage reste donc collé à la cible. */
function applyZoom(){
  const z = S.zoom||1;
  const zr = document.getElementById('zoomer');
  if(zr) zr.style.transform = `scale(${z}) translate(${S.pan.x/z}px, ${S.pan.y/z}px)`;
  const zv = document.getElementById('zoomval');
  if(zv) zv.textContent = z.toFixed(1)+'×';
  const zs = document.getElementById('zoomrange');
  if(zs && +zs.value !== z) zs.value = z;
  // les références ne sont remises à zéro que si le cadrage a vraiment changé,
  // sinon chaque rendu effaçait le fond et la fléchette devenait invisible
}
function setZoom(z){
  S.zoom = Math.min(4, Math.max(1, +z||1));
  if(S.zoom===1) S.pan = {x:0,y:0};
  save(K.zoom, S.zoom);
  applyZoom();
}
function setupPinch(node){
  let d0=0, z0=1, p0=null, pan0=null;
  const dist = t => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const mid = t => ({x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2});
  node.addEventListener('touchstart', e=>{
    if(e.touches.length!==2) return;
    e.preventDefault();
    d0 = dist(e.touches); z0 = S.zoom||1; p0 = mid(e.touches); pan0 = {...S.pan};
  }, {passive:false});
  node.addEventListener('touchmove', e=>{
    if(e.touches.length!==2 || !d0) return;
    e.preventDefault();
    const k = dist(e.touches)/d0;
    S.zoom = Math.min(4, Math.max(1, z0*k));
    const m = mid(e.touches);
    S.pan = {x: pan0.x + (m.x-p0.x), y: pan0.y + (m.y-p0.y)};
    if(S.zoom<=1.02){ S.zoom=1; S.pan={x:0,y:0}; }
    applyZoom();
  }, {passive:false});
  node.addEventListener('touchend', e=>{
    if(e.touches.length<2 && d0){ d0=0; save(K.zoom, S.zoom); renderCamControls(); }
  });
}
function resizeOverlay(){
  if(!ovC || !video) return;
  const r = video.getBoundingClientRect();
  if(!r.width) return;
  const w = Math.round(r.width), h = Math.round(r.height);
  if(w===ovC.width && h===ovC.height){ drawOverlay(); return; }
  ovC.width = w; ovC.height = h;
  // le calage est mémorisé dans le repère de l'image caméra : il se
  // reconstruit correctement quel que soit le format d'affichage
  calibFromSource();
  drawOverlay();
}
/* conversions entre l'affichage et l'image de la caméra */
function dispToSrcNorm(px,py){
  const f = fitRect();
  return [ ((px-f.dx)/f.k)/f.vw, ((py-f.dy)/f.k)/f.vh ];
}
function srcNormToDisp(nx,ny){
  const f = fitRect();
  return [ nx*f.vw*f.k + f.dx, ny*f.vh*f.k + f.dy ];
}
function calibFromSource(){
  if(!S.calibSrc || !video || !video.videoWidth || !ovC.width) return false;
  const pts = S.calibSrc.map(([nx,ny])=>srcNormToDisp(nx,ny));
  const Hb = solveHomography(pts, CAL_TARGETS);
  S.calib = {pts, Hb, Himg:invH(Hb)};
  gRef = null; gEmpty = null;
  return true;
}
function setCalib(pts, persist){
  const Hb = solveHomography(pts, CAL_TARGETS);
  S.calib = {pts:pts.slice(), Hb, Himg:invH(Hb)};
  gRef = null; gEmpty = null;
  if(video && video.videoWidth && ovC.width){
    S.calibSrc = pts.map(([x,y])=>dispToSrcNorm(x,y));
    if(persist!==false) save(K.calib, {src:S.calibSrc});
  }
}
function loadCalib(){
  const c = load(K.calib, null);
  if(!c || !c.src || !ovC || !ovC.width) return false;
  S.calibSrc = c.src;
  return calibFromSource();
}
async function startCamera(){
  ensureCamNode();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{
      facingMode:'environment',
      width:{ideal:1920}, height:{ideal:1440},
      frameRate:{ideal:30}
    }, audio:false});
    video.srcObject = stream;
    await video.play();
    S.camOn = true; S.err = null;
    setTimeout(()=>{
      resizeOverlay();
      if(!S.calib) loadCalib();
      drawOverlay(); renderCamHint();
      // cible déjà calée : la détection démarre seule, sans bouton à presser
      setTimeout(()=>{
        if(!S.camOn) return;
        if(S.calib && !S.detecting && !S.adjustMode) captureBaseline();
        else if(!S.calib){ startCalib(); render(); }
      }, 600);
    }, 350);
  }catch(e){
    S.camOn = false;
    S.err = "La caméra n'a pas démarré. Vérifie l'autorisation du navigateur, ou compte au clavier.";
  }
  render();
}
function stopCamera(){
  try{ if(video && video.srcObject){ video.srcObject.getTracks().forEach(t=>t.stop()); video.srcObject=null; } }catch(e){}
  if(detectTimer){ clearTimeout(detectTimer); detectTimer=null; }
  S.camOn=false; S.detecting=false; gRef=null; gEmpty=null; gPrev=null; S.candidate=null;
}
function vScale(){
  const vw = video.videoWidth||640, vh = video.videoHeight||480;
  return {vw, vh, sx: ovC.width/vw, sy: ovC.height/vh};
}
function drawRing(H,r){
  ovX.beginPath();
  for(let a=0;a<=360;a+=6){
    const t=a*Math.PI/180;
    const [ix,iy]=applyH(H, r*Math.sin(t), r*Math.cos(t));
    if(a===0) ovX.moveTo(ix,iy); else ovX.lineTo(ix,iy);
  }
  ovX.stroke();
}
function drawOverlay(){
  if(!ovX) return;
  ovX.clearRect(0,0,ovC.width,ovC.height);

  if(S.calib){
    const H = S.calib.Himg;
    // rayons de la cible
    ovX.strokeStyle='rgba(124,92,252,.85)'; ovX.lineWidth=1.4;
    [1.0,R_DBL_IN,R_TRI_OUT,R_TRI_IN,R_BULL,R_DBULL].forEach(r=>drawRing(H,r));
    // séparations de secteurs : le calage se vérifie d'un coup d'œil
    ovX.strokeStyle='rgba(124,92,252,.32)'; ovX.lineWidth=1;
    for(let k=0;k<20;k++){
      const a = (k+0.5)*Math.PI/10;
      const [x1,y1] = applyH(H, R_BULL*Math.sin(a), R_BULL*Math.cos(a));
      const [x2,y2] = applyH(H, 1.0*Math.sin(a), 1.0*Math.cos(a));
      ovX.beginPath(); ovX.moveTo(x1,y1); ovX.lineTo(x2,y2); ovX.stroke();
    }
    // numéros repères
    ovX.fillStyle='rgba(255,255,255,.72)';
    ovX.font='bold 11px Arial, sans-serif'; ovX.textAlign='center'; ovX.textBaseline='middle';
    [0,5,10,15].forEach(k=>{
      const a = k*Math.PI/10;
      const [x,y] = applyH(H, 1.14*Math.sin(a), 1.14*Math.cos(a));
      ovX.fillText(String(SECTORS[k]), x, y);
    });
    // repères de calage : gros et nommés pendant le réglage
    const noms = ['20','6','3','11'];
    S.calib.pts.forEach(([x,y],i)=>{
      if(S.adjustMode){
        ovX.fillStyle='rgba(143,214,148,.95)';
        ovX.beginPath(); ovX.arc(x,y,13,0,Math.PI*2); ovX.fill();
        ovX.fillStyle='#0D1017'; ovX.font='bold 11px Arial, sans-serif';
        ovX.textAlign='center'; ovX.textBaseline='middle';
        ovX.fillText(noms[i], x, y);
      } else {
        ovX.fillStyle='rgba(124,92,252,.95)';
        ovX.beginPath(); ovX.arc(x,y,3.5,0,Math.PI*2); ovX.fill();
      }
    });
  } else if(S.calibPts.length){
    ovX.fillStyle='rgba(124,92,252,.95)'; ovX.font='bold 12px Arial, sans-serif';
    ovX.textAlign='center'; ovX.textBaseline='middle';
    S.calibPts.forEach(([x,y],i)=>{
      ovX.beginPath(); ovX.arc(x,y,6,0,Math.PI*2); ovX.fill();
      ovX.fillStyle='#fff'; ovX.fillText(String(i+1), x, y);
      ovX.fillStyle='rgba(124,92,252,.95)';
    });
  }

  // fléchette repérée : pointe, axe et score pressenti
  const c = S.candidate;
  if(c){
    ovX.strokeStyle='rgba(143,214,148,.95)'; ovX.lineWidth=2;
    ovX.beginPath(); ovX.arc(c.x, c.y, 11, 0, Math.PI*2); ovX.stroke();
    ovX.beginPath(); ovX.moveTo(c.x-16,c.y); ovX.lineTo(c.x-5,c.y);
    ovX.moveTo(c.x+5,c.y); ovX.lineTo(c.x+16,c.y);
    ovX.moveTo(c.x,c.y-16); ovX.lineTo(c.x,c.y-5);
    ovX.moveTo(c.x,c.y+5); ovX.lineTo(c.x,c.y+16); ovX.stroke();
    if(c.score){
      const label = c.score.label;
      ovX.font='bold 13px Arial, sans-serif'; ovX.textAlign='center'; ovX.textBaseline='middle';
      const w = ovX.measureText(label).width + 14;
      const bx = Math.min(Math.max(c.x, w/2+4), ovC.width-w/2-4), by = Math.max(16, c.y-26);
      ovX.fillStyle='rgba(13,16,23,.88)';
      ovX.fillRect(bx-w/2, by-11, w, 22);
      ovX.strokeStyle='rgba(143,214,148,.9)'; ovX.lineWidth=1;
      ovX.strokeRect(bx-w/2, by-11, w, 22);
      ovX.fillStyle='#fff'; ovX.fillText(label, bx, by);
    }
  }
}

function evtPoint(evt){
  const rect = ovC.getBoundingClientRect();
  const t = evt.touches && evt.touches[0] ? evt.touches[0] : evt;
  const cx = t.clientX - rect.left, cy = t.clientY - rect.top;
  return [cx*(ovC.width/rect.width), cy*(ovC.height/rect.height)];
}
/* le calage démarre avec 4 repères déjà placés en losange :
   il n'y a plus d'ordre à respecter ni d'étape à valider,
   on fait juste glisser chaque repère sur le bord de la double */
function startCalib(){
  const w = ovC.width, h = ovC.height;
  const cx = w/2, cy = h/2;
  const r = Math.min(w,h)*0.34;
  setCalib([[cx,cy-r],[cx+r,cy],[cx,cy+r],[cx-r,cy]], true);
  S.adjustMode = true;
  S.detecting = false;
  drawOverlay();
}
/* fin du calage : on enchaîne directement sur le comptage */
function finishCalib(){
  S.adjustMode = false;
  captureBaseline();
  toast('Cible calée, comptage en route.','good');
  render();
}
function onBoardTap(evt){
  if(!ovC) return;
  const [px,py] = evtPoint(evt);
  if(!S.calib){ startCalib(); render(); return; }
  if(S.adjustMode) return;          // en calage, seul le glissement agit
  if(S.view==='play' && myTurnOpen()){
    S.pending = {...scoreAt(px,py), x:px, y:py, manual:true};
    buzz(10);
    render();
  }
}
function onBoardDown(evt){
  if(!S.calib || !S.adjustMode) return;
  const [px,py] = evtPoint(evt);
  let best=-1, bd=1e9;
  S.calib.pts.forEach(([x,y],i)=>{ const d=Math.hypot(x-px,y-py); if(d<bd){ bd=d; best=i; } });
  S.dragPt = bd<56 ? best : -1;
  if(S.dragPt>=0){ evt.preventDefault(); buzz(8); }
}
function onBoardMove(evt){
  if(S.dragPt<0 || !S.calib) return;
  evt.preventDefault();
  const [px,py] = evtPoint(evt);
  const pts = S.calib.pts.slice();
  pts[S.dragPt] = [px,py];
  setCalib(pts, false);
  drawOverlay();
}
function onBoardUp(){
  if(S.dragPt<0) return;
  S.dragPt = -1;
  setCalib(S.calib.pts.slice(), true);   // on garde le réglage
  drawOverlay();
}
function scoreAt(px,py){
  const [qx,qy] = applyH(S.calib.Hb, px, py);
  return scoreOnBoard(qx,qy);
}
/* coordonnées cible normalisées (rayon 1 = bord extérieur de la double) */
function scoreOnBoard(qx,qy){
  const r = Math.hypot(qx,qy);
  if(r>R_DBL_OUT) return dartOf(0,0);
  if(r<R_DBULL) return dartOf(2,25);
  if(r<R_BULL) return dartOf(1,25);
  let th = Math.atan2(qx,qy);
  th = ((th % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  const num = SECTORS[Math.round(th/(Math.PI/10)) % 20];
  let mult = 1;
  if(r>=R_TRI_IN && r<=R_TRI_OUT) mult=3;
  else if(r>=R_DBL_IN && r<=R_DBL_OUT) mult=2;
  return dartOf(mult,num);
}
/* point visé, en coordonnées cible */
function aimPoint(mult,num){
  if(num===25) return [0,0];
  const idx = SECTORS.indexOf(num);
  if(idx<0) return [0,0];
  const th = idx*Math.PI/10;
  const r = mult===3 ? (R_TRI_IN+R_TRI_OUT)/2
          : mult===2 ? (R_DBL_IN+R_DBL_OUT)/2
          : 0.42;                      // simple intérieur, la zone la plus large
  return [r*Math.sin(th), r*Math.cos(th)];
}
/* =========================================================
   DÉTECTION
   Image réduite en niveaux de gris, différence avec un fond
   de référence, analyse des zones connexes, estimation de la
   pointe par axe principal, et validation sur images stables.
========================================================= */
/* un seul profil : le seuil s'adapte déjà au bruit de l'image
   et la taille minimale à la taille de la cible */
const PROFIL = {thr:16, areaK:0.85, frames:3};
const DET = {
  W: 512,              // largeur de travail : plus de pixels sur la cible
  maxAreaRatio: 0.16,  // au-delà : bras ou occultation
  moveRatio: 0.06,     // stabilité de la pointe, en fraction du rayon de cible
  motionTol: 0.022,    // part de pixels qui bougent = scène instable
  clearFactor: 0.25,   // seuil de cible nue, volontairement bas
  clearFrames: 4,      // et confirmé sur plusieurs images
  cooldown: 800,
  period: 170
};
function sens(){ return PROFIL; }

/* rayon de la cible en pixels réduits, déduit du calage */
function boardRadiusPx(){
  if(!S.calib) return 0;
  const kx = gW/ovC.width, ky = gH/ovC.height;
  const pts = S.calib.pts.map(([x,y])=>[x*kx, y*ky]);
  const cx = (pts[0][0]+pts[2][0])/2, cy = (pts[1][1]+pts[3][1])/2;
  return pts.reduce((m,[x,y])=>m+Math.hypot(x-cx,y-cy),0)/4;
}
/* taille minimale d'une fléchette : elle dépend de la taille de la cible
   dans l'image, pas d'une constante. C'est ce qui manquait : sur un cadrage
   large, une fléchette tombait sous le seuil et n'était jamais vue. */
function minBlob(R){ return Math.max(6, Math.round(0.0022*R*R*sens().areaK)); }

let gRef = null;    // état accepté : cible + fléchettes déjà comptées
let gEmpty = null;  // cible nue, sert à repérer le retrait des fléchettes
let gPrev = null, gW = 0, gH = 0, gMask = null;
let detCooldownUntil = 0, clearStreak = 0;

/* zone de l'image source réellement visible à l'écran.
   La vidéo est affichée en object-fit: cover et peut être zoomée :
   sans ce calcul, l'analyse portait sur une autre zone que celle
   où l'utilisateur a calé sa cible. */
/* géométrie d'affichage de la vidéo dans son cadre.
   Vue normale : image recadrée pour remplir. Plein écran : image entière,
   pour voir toute la cible. Le zoom n'entre pas dans ce calcul, c'est un
   agrandissement d'affichage qui emporte aussi l'overlay. */
function fitRect(){
  const vw = video.videoWidth||640, vh = video.videoHeight||480;
  const ow = ovC.width||1, oh = ovC.height||1;
  const k = S.fullCam ? Math.min(ow/vw, oh/vh) : Math.max(ow/vw, oh/vh);
  const dw = vw*k, dh = vh*k;                 // taille de l'image affichée
  const dx = (ow-dw)/2, dy = (oh-dh)/2;       // marges (négatives si recadré)
  return {vw, vh, k, dw, dh, dx, dy};
}
function sourceRect(){
  const f = fitRect();
  const sw = Math.min(f.vw, (ovC.width||1)/f.k);
  const sh = Math.min(f.vh, (ovC.height||1)/f.k);
  return {sx:(f.vw-sw)/2, sy:(f.vh-sh)/2, sw, sh};
}
function grabGray(){
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw || !vh) return null;
  const ow = ovC.width||1, oh = ovC.height||1;
  gW = DET.W; gH = Math.max(1, Math.round(DET.W*oh/ow));
  if(wkC.width!==gW || wkC.height!==gH){ wkC.width=gW; wkC.height=gH; }
  const f = fitRect();
  const k2 = gW/(ovC.width||1);
  wkX.fillStyle = '#000';
  wkX.fillRect(0,0,gW,gH);
  wkX.drawImage(video, 0, 0, f.vw, f.vh, f.dx*k2, f.dy*k2, f.dw*k2, f.dh*k2);
  const d = wkX.getImageData(0,0,gW,gH).data;
  const g = new Uint8ClampedArray(gW*gH);
  for(let i=0,j=0;j<g.length;i+=4,j++) g[j] = (d[i]*77 + d[i+1]*151 + d[i+2]*28) >> 8;
  return g;
}
/* zone utile : boîte des points de calage, en coordonnées réduites */
function boardBox(){
  const kx = gW/ovC.width, ky = gH/ovC.height;
  const xs = S.calib.pts.map(p=>p[0]*kx), ys = S.calib.pts.map(p=>p[1]*ky);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const mx=(x1-x0)*0.14, my=(y1-y0)*0.14;
  return {
    x0: Math.max(1, Math.floor(x0-mx)), x1: Math.min(gW-1, Math.ceil(x1+mx)),
    y0: Math.max(1, Math.floor(y0-my)), y1: Math.min(gH-1, Math.ceil(y1+my))
  };
}
function toOverlay(x,y){ return [x*ovC.width/gW, y*ovC.height/gH]; }

function captureBaseline(){
  const g = grabGray();
  if(!g) return;
  gRef = g; gEmpty = g.slice(); gPrev = g.slice();
  S.detecting = true; S.candidate = null; S.detStatus = 'prête';
  clearStreak = 0;
  render(); loopDetect();
}
function loopDetect(){
  if(detectTimer) clearTimeout(detectTimer);
  if(!S.detecting || S.view!=='play') return;
  try{ detectFrame(); }catch(e){ /* une image ratée ne doit pas casser la boucle */ }
  renderDiag();
  const fs = document.getElementById('fs-status');
  if(fs) fs.textContent = S.detStatus||'';
  detectTimer = setTimeout(loopDetect, DET.period);
}

function detectFrame(){
  if(!S.calib || !video || !S.camOn) return;
  const g = grabGray();
  if(!g) return;
  if(!gRef || gRef.length!==g.length){ gRef = g; gEmpty = g.slice(); gPrev = g.slice(); return; }
  if(!gEmpty || gEmpty.length!==g.length) gEmpty = g.slice();

  const box = boardBox();
  const cfg = sens();
  const R = boardRadiusPx();
  const minArea = minBlob(R);
  const moveTol = Math.max(3, R*DET.moveRatio);

  // 1. bruit du capteur : le seuil s'adapte à l'image plutôt que d'être fixe
  let noise = 0, ns = 0;
  for(let y=box.y0;y<box.y1;y+=7){
    for(let x=box.x0;x<box.x1;x+=7){
      const i=y*gW+x; noise += Math.abs(g[i]-gRef[i]); ns++;
    }
  }
  noise = ns? noise/ns : 0;
  const thr = Math.max(cfg.thr, Math.round(noise*3.2));

  // 2. la scène bouge-t-elle ? (bras, main, caméra bousculée)
  let moved = 0, total = 0;
  for(let y=box.y0;y<box.y1;y+=2){
    for(let x=box.x0;x<box.x1;x+=2){
      const i=y*gW+x; total++;
      if(Math.abs(g[i]-gPrev[i])>Math.max(12,thr)) moved++;
    }
  }
  gPrev = g.slice();
  const motion = moved/Math.max(1,total);

  // 3. différence avec l'état accepté
  if(!gMask || gMask.length!==gW*gH) gMask = new Uint8Array(gW*gH);
  gMask.fill(0);
  let on = 0, area = 0;
  for(let y=box.y0;y<box.y1;y++){
    for(let x=box.x0;x<box.x1;x++){
      const i=y*gW+x; area++;
      if(Math.abs(g[i]-gRef[i]) > thr){ gMask[i]=1; on++; }
    }
  }
  const fill = on/Math.max(1,area);

  // diagnostic lisible, pour comprendre pourquoi ça ne lit pas
  S.diag = {R:Math.round(R), thr, minArea, on, motion:+motion.toFixed(3), blob:0};

  if(motion > DET.motionTol){
    S.candidate = null; S.detStatus = 'mouvement'; drawOverlay(); return;
  }
  if(fill > DET.maxAreaRatio){
    S.candidate = null; S.detStatus = 'cible masquée'; drawOverlay(); return;
  }

  // 4. cible nue ? on compare à la référence sans fléchette, sur toute la zone.
  // Test volontairement strict : une référence rafraîchie à tort avale la
  // fléchette et la rend indétectable.
  let empty = 0;
  for(let y=box.y0;y<box.y1;y++){
    for(let x=box.x0;x<box.x1;x++){
      const i=y*gW+x;
      if(Math.abs(g[i]-gEmpty[i]) > thr) empty++;
    }
  }
  if(empty < minArea*DET.clearFactor){
    clearStreak++;
    if(clearStreak>=DET.clearFrames){ gRef = g; gEmpty = g.slice(); clearStreak = 0; }
    S.candidate = null; S.detStatus = 'prête'; drawOverlay(); return;
  }
  clearStreak = 0;

  if(on < minArea*0.5){
    S.candidate = null; S.detStatus = 'prête'; drawOverlay(); return;
  }
  if(now() < detCooldownUntil){ S.detStatus='prête'; drawOverlay(); return; }

  // 5. plus grande zone connexe
  const blob = largestBlob(box, minArea);
  if(!blob){
    S.candidate = null;
    S.detStatus = on > minArea*0.5 ? 'trop petit' : 'prête';
    drawOverlay(); return;
  }
  S.diag.blob = blob.count;

  // 6. pointe de la fléchette
  const tip = estimateTip(blob);
  if(!tip){ S.candidate=null; drawOverlay(); return; }
  const [ox,oy] = toOverlay(tip.x, tip.y);

  // 7. stabilité sur plusieurs images
  if(S.candidate && Math.hypot(S.candidate.rx-tip.x, S.candidate.ry-tip.y) < moveTol){
    S.candidate.age++; S.candidate.rx=tip.x; S.candidate.ry=tip.y; S.candidate.x=ox; S.candidate.y=oy;
  } else {
    S.candidate = {x:ox, y:oy, rx:tip.x, ry:tip.y, age:1};
  }
  S.candidate.score = scoreAt(ox,oy);
  S.detStatus = 'fléchette repérée';
  drawOverlay();

  if(S.candidate.age >= cfg.frames){
    const sc = S.candidate.score;
    gRef = g;                       // la fléchette entre dans l'état accepté
    detCooldownUntil = now() + DET.cooldown;
    S.candidate = null;
    S.detStatus = 'prête';
    if(!myTurnOpen()) return;       // hors tour : on suit sans marquer
    S.pending = {...sc, x:ox, y:oy};
    buzz(15);
    render();
  }
}

/* plus grande composante connexe du masque */
function largestBlob(box, minArea){
  const seen = new Uint8Array(gW*gH);
  const stack = new Int32Array(gW*gH);
  let best = null;
  for(let y=box.y0;y<box.y1;y++){
    for(let x=box.x0;x<box.x1;x++){
      const start = y*gW+x;
      if(!gMask[start] || seen[start]) continue;
      let sp=0, count=0;
      stack[sp++]=start; seen[start]=1;
      const pts=[];
      while(sp){
        const i=stack[--sp];
        const px=i%gW, py=(i-px)/gW;
        pts.push(px,py); count++;
        // 8 voisins : un fût fin en diagonale ne se touche qu'en coin,
        // en 4 voisins la pointe se détachait du reste de la fléchette
        for(let oy=-1;oy<=1;oy++){
          const ny = py+oy;
          if(ny<box.y0 || ny>=box.y1) continue;
          for(let ox=-1;ox<=1;ox++){
            const nx = px+ox;
            if(nx<box.x0 || nx>=box.x1 || (!ox && !oy)) continue;
            const j = ny*gW+nx;
            if(gMask[j] && !seen[j]){ seen[j]=1; stack[sp++]=j; }
          }
        }
      }
      if(count>=minArea && (!best || count>best.count)) best = {count, pts};
    }
  }
  return best;
}

/* axe principal du blob, puis extrémité la plus fine = la pointe */
function estimateTip(blob){
  const pts = blob.pts, n = blob.count;
  let mx=0,my=0;
  for(let k=0;k<pts.length;k+=2){ mx+=pts[k]; my+=pts[k+1]; }
  mx/=n; my/=n;
  let sxx=0,syy=0,sxy=0;
  for(let k=0;k<pts.length;k+=2){
    const dx=pts[k]-mx, dy=pts[k+1]-my;
    sxx+=dx*dx; syy+=dy*dy; sxy+=dx*dy;
  }
  sxx/=n; syy/=n; sxy/=n;
  const tr=sxx+syy, det=sxx*syy-sxy*sxy;
  const l1=tr/2 + Math.sqrt(Math.max(0,tr*tr/4-det));
  let ax, ay;
  if(Math.abs(sxy)>1e-6){ ax=l1-syy; ay=sxy; }
  else { ax = sxx>=syy?1:0; ay = sxx>=syy?0:1; }
  const norm=Math.hypot(ax,ay)||1; ax/=norm; ay/=norm;

  // projection sur l'axe, extrémités
  let tMin=Infinity, tMax=-Infinity;
  for(let k=0;k<pts.length;k+=2){
    const t=(pts[k]-mx)*ax + (pts[k+1]-my)*ay;
    if(t<tMin) tMin=t;
    if(t>tMax) tMax=t;
  }
  const len = tMax-tMin;
  if(len < 3) return {x:mx, y:my};

  // 1. quel bout est la pointe ? l'empennage est large, la pointe est fine
  const band = Math.max(2, len*0.22);
  let wLow=0,cLow=0,wHigh=0,cHigh=0;
  for(let k=0;k<pts.length;k+=2){
    const dx=pts[k]-mx, dy=pts[k+1]-my;
    const t=dx*ax+dy*ay;
    const u=Math.abs(-dx*ay+dy*ax);
    if(t <= tMin+band){ wLow+=u; cLow++; }
    else if(t >= tMax-band){ wHigh+=u; cHigh++; }
  }
  const thickLow = cLow? wLow/cLow : 99, thickHigh = cHigh? wHigh/cHigh : 99;
  const useLow = thickLow <= thickHigh;

  // 2. position exacte : moyenne des pixels les plus avancés sur l'axe,
  // sinon la pointe est estimée en retrait et un triple se lit en simple
  const edge = useLow ? tMin : tMax;
  let ex=0, ey=0, en=0;
  for(let k=0;k<pts.length;k+=2){
    const t=(pts[k]-mx)*ax + (pts[k+1]-my)*ay;
    if(Math.abs(t-edge) <= 1.6){ ex+=pts[k]; ey+=pts[k+1]; en++; }
  }
  if(en) return {x:ex/en, y:ey/en, axis:[ax,ay], len, tipEnd:useLow?'min':'max'};
  return {x:mx + ax*edge, y:my + ay*edge, axis:[ax,ay], len};
}

const V = {};

function authError(e){
  const m = (e && (e.message||e.error_description)) || '';
  if(/Invalid login credentials/i.test(m)) return 'Mail ou mot de passe incorrect.';
  if(/Email not confirmed/i.test(m)) return "Ce compte n'est pas encore confirmé. Ouvre le mail de confirmation.";
  if(/User already registered/i.test(m)) return 'Un compte existe déjà avec cette adresse.';
  if(/rate limit|too many/i.test(m)) return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(/only request this after (\d+)/i.test(m)) return 'Patiente '+m.match(/after (\d+)/i)[1]+' secondes avant de redemander un mail.';
  if(/email address .*invalid|invalid email/i.test(m)) return "Cette adresse mail n'est pas acceptée par le serveur. Vérifie l'orthographe.";
  if(/signups not allowed|disabled/i.test(m)) return "Les inscriptions sont désactivées sur le projet.";
  if(/Password/i.test(m)) return 'Mot de passe trop court ou trop simple.';
  return m || 'La connexion au serveur a échoué.';
}
/* retour depuis un mail de confirmation ou un lien magique */
async function handleAuthReturn(){
  const q = new URLSearchParams(location.search);
  const h = new URLSearchParams(location.hash.replace(/^#/,''));
  const err = q.get('error_description') || h.get('error_description');
  const code = q.get('code');
  const hasToken = !!h.get('access_token');
  const tokenHash = q.get('token_hash');
  const type = q.get('type');
  if(!err && !code && !hasToken && !tokenHash) return;

  if(err){
    S.err = /expired|invalid/i.test(err)
      ? "Ce lien de confirmation a expiré. Demande un nouveau mail depuis l'écran de connexion."
      : err;
    cleanUrl();
    return;
  }
  try{
    if(code) await sb.auth.exchangeCodeForSession(code);
    else if(tokenHash) await sb.auth.verifyOtp({token_hash:tokenHash, type: type||'email'});
    // le cas access_token est traité automatiquement par le client
    const {data} = await sb.auth.getSession();
    if(data && data.session){
      S.msg = type==='recovery' ? 'Lien validé, tu peux changer ton mot de passe.' : 'Adresse confirmée, te voilà connectée.';
    } else {
      S.msg = 'Adresse confirmée. Connecte-toi avec ton mot de passe.';
    }
  }catch(e){
    S.err = "La confirmation n'a pas pu être finalisée. Réessaie depuis l'écran de connexion.";
  }
  cleanUrl();
}
function cleanUrl(){
  try{ history.replaceState({}, '', location.pathname); }catch(e){}
}

/* renvoyer un mail de confirmation */
async function resendConfirmation(mail){
  if(!ONLINE) return {err:'Serveur injoignable.'};
  if(!/^\S+@\S+\.\S+$/.test(mail)) return {err:'Entre ton adresse mail au-dessus, puis redemande le lien.'};
  const {error} = await sb.auth.resend({type:'signup', email:mail, options:{emailRedirectTo: location.origin + location.pathname}});
  if(error) return {err: authError(error)};
  return {ok:'Nouveau mail envoyé. Pense à regarder dans les indésirables.'};
}

async function refreshCaches(){
  if(!ONLINE || !ME) return;
  await Promise.all([loadFriends(), loadFeed()]);
  render();
}

async function startOnlineMatch(){

  const m = newMatch(S.setup);
  m.code = r.code; m.rev = 1; m.hostId = (me()||{}).id;

  if(ONLINE) await sb.from('rooms').update(patch).eq('code', r.code);
  else { const all = rooms(); all[r.code] = {...all[r.code], ...patch}; save(K.rooms, all); }

  S.room = null;
  S.showCam = !!load(K.camPref, false);

  go('play');

}

    root.querySelector('#j-go').onclick = ()=>joinRoom(root.querySelector('#j-code').value);
    root.querySelector('#j-code').addEventListener('keydown',e=>{ if(e.key==='Enter') root.querySelector('#j-go').click(); });
    return root;
  }

  /* waiting room */
  const r = S.room;
  const root = el(`<div class="stack" style="gap:18px;">
    <div class="between"><button class="btn-q" id="f-cancel">‹ Annuler</button><p class="eyebrow">En attente</p></div>
    <div class="code-box">
      <p class="cl">Code de partie</p>
      <div class="cd tnum">${esc(r.code)}</div>
    </div>
    <button class="btn btn-p wide" id="f-copy">Partager l'invitation</button>
    <div class="card tight">
      <h3>Réglages</h3>
      <div class="log-row"><span class="lp">Mode</span><span class="lv">${modeLabel(r.setup.mode, r.setup.conf)}</span></div>
      ${r.setup.mode==='x01'? `<div class="log-row"><span class="lp">Départ</span><span class="lv">${r.setup.conf.start} · ${r.setup.conf.doubleOut?'double out':'sortie libre'}</span></div>`:''}
      <div class="log-row"><span class="lp">Joueurs</span><span class="lv">${r.setup.players.length}/4</span></div>
    </div>
    <div class="card tight">
      <h3>Dans la partie</h3>
      ${r.setup.players.map(p=>`<div class="frow">${avatarHTML(p,32)}<span class="fn">${esc(p.name)}</span><span class="fa small">${p.uid===me().id?'toi':'a rejoint'}</span></div>`).join('')}
      ${r.setup.players.length<2? `<p class="small">En attente d'un joueur. Le code reste valable tant que la partie n'est pas lancée.</p>`
        : r.setup.players.length<4? `<p class="small">La partie peut démarrer. Tu peux aussi attendre jusqu'à 4 joueurs.</p>`:''}
    </div>
    ${r.host===me().id
      ? `<button class="btn btn-p wide" id="f-start" ${r.setup.players.length<2?'disabled':''}>${r.setup.players.length<2?'En attente d\'un joueur':'Lancer la partie'}</button>`
      : `<div class="card tight"><p class="small">Tu as rejoint la partie. Elle démarrera dès que l'hôte la lancera.</p></div>`}
    <p class="small">Un joueur peut aussi rejoindre depuis cet appareil pour tester le déroulé.</p>
  </div>`);
  const isHost = r.host === me().id;
  root.querySelector('#f-cancel').onclick = async ()=>{
    // l'hôte annule la partie, l'invité se retire seulement
    if(isHost) await deleteRoom(); else await leaveRoom();
    S.friendStep='choice'; render();
  };
  root.querySelector('#f-copy').onclick = async ()=>{
    const texte = `Rejoins ma partie sur KIVO avec le code ${r.code} : ${location.origin+location.pathname}`;
    if(navigator.share){
      try{ await navigator.share({title:'KIVO', text:texte}); return; }catch(err){ if(err && err.name==='AbortError') return; }
    }
    try{ await navigator.clipboard.writeText(texte); toast('Invitation copiée, colle-la dans ton message.','good'); }
    catch(err){ toast('Copie impossible, note le code '+r.code,'bad'); }
  };
  // le bouton n'existe que chez l'hôte : sans ce test, la vue plantait
  // chez l'invité et laissait un écran noir
  const startBtn = root.querySelector('#f-start');
  if(startBtn) startBtn.onclick = ()=>{ startOnlineMatch(); };
  return root;
};

function rooms(){ return load(K.rooms, {}); }
let roomTimer = null, syncTimer = null;

async function createRoom(){
  const code = genCode();
  const u = me();
  if(ONLINE){
    const {data, error} = await sb.from('rooms').insert({code, host:u.id, setup:S.setup, status:'waiting'}).select().single();
    if(error){ S.err = "La partie n'a pas pu être créée. Réessaie."; return render(); }
    S.room = data;
  } else {
    const all = rooms();
    all[code] = {code, host:u.id, setup:S.setup, status:'waiting', createdAt:now()};
    save(K.rooms, all);
    S.room = all[code];
  }
  S.friendStep='wait';
  go('friend');
  watchRoom();
}

async function joinRoom(codeRaw){
  const code = (codeRaw||'').trim().toUpperCase();
  const u = me();
  if(!code){ S.err='Entre le code reçu de ton ami.'; return render(); }
  if(ONLINE){
    const {data:r} = await sb.from('rooms').select('*').eq('code', code).maybeSingle();
    if(!r){ S.err = 'Aucune partie ne correspond à ce code. Vérifie-le avec ton ami.'; return render(); }
    if(r.status!=='waiting'){ S.err = 'Cette partie a déjà démarré.'; return render(); }
    const setup = r.setup;
    if(setup.players.length>=4 && !setup.players.some(p=>p.uid===u.id)){ S.err='Cette partie est complète.'; return render(); }
    if(!setup.players.some(p=>p.uid===u.id)) setup.players.push({uid:u.id, name:u.name, photo:u.photo});
    const {data:up, error} = await sb.from('rooms').update({setup}).eq('code', code).select().single();
    if(error){ S.err = "Impossible de rejoindre. Réessaie."; return render(); }
    S.room = up; S.friendStep='wait'; S.err=null;
    render(); watchRoom();
    return;
  }
  const all = rooms();
  const r = all[code];
  if(!r){ S.err = 'Aucune partie ne correspond à ce code. Vérifie-le avec ton ami.'; return render(); }
  if(r.setup.players.length>=4){ S.err = 'Cette partie est complète.'; return render(); }
  if(!r.setup.players.some(p=>p.uid===u.id)) r.setup.players.push({uid:u.id, name:u.name, photo:u.photo});
  all[code]=r; save(K.rooms, all);
  S.room = r; S.friendStep='wait'; S.err=null;
  render(); watchRoom();
}

/* le salon d'attente se rafraîchit, et bascule en partie dès que l'hôte lance */
function watchRoom(){
  stopWatchRoom();
  if(!S.room) return;
  roomTimer = setInterval(async ()=>{
    if(!S.room || S.view!=='friend'){ return; }
    let r = null;
    if(ONLINE){
      const {data} = await sb.from('rooms').select('*').eq('code', S.room.code).maybeSingle();
      r = data;
    } else {
      r = rooms()[S.room.code];
    }
    if(!r) return;
    const changed = JSON.stringify(r.setup.players) !== JSON.stringify(S.room.setup.players);
    S.room = r;
    if(r.status==='playing' && r.state){
      stopWatchRoom();
      S.match = r.state;
      S.match.code = r.code;
      S.showCam = !!load(K.camPref,false);
      go('play');
      if(S.showCam && !S.camOn) startCamera();
      startSync();
      return;
    }
    if(changed) render();
  }, 2000);
}
function stopWatchRoom(){ if(roomTimer){ clearInterval(roomTimer); roomTimer=null; } }

async function leaveRoom(){
  stopWatchRoom();
  if(!S.room) return;
  const u = me();
  const setup = S.room.setup;
  setup.players = setup.players.filter(p=>p.uid!==u.id);
  if(ONLINE) await sb.from('rooms').update({setup}).eq('code', S.room.code);
  else { const all = rooms(); if(all[S.room.code]){ all[S.room.code].setup = setup; save(K.rooms, all); } }
  S.room = null;
}
async function deleteRoom(){
  stopWatchRoom();
  if(!S.room) return;
  if(ONLINE){ await sb.from('rooms').delete().eq('code', S.room.code); }
  else { const all = rooms(); delete all[S.room.code]; save(K.rooms, all); }
  S.room = null;
}

/* --- synchronisation de la partie entre appareils --- */
async function pushMatch(){
  const m = S.match;
  if(!m || m.context!=='online' || !m.code) return;
  m.rev = (m.rev||0)+1;
  const patch = {state:m, status: m.winner? 'done':'playing'};
  if(ONLINE) await sb.from('rooms').update(patch).eq('code', m.code);
  else { const all=rooms(); if(all[m.code]){ all[m.code]={...all[m.code], ...patch}; save(K.rooms,all); } }
}
async function pullMatch(){
  const m = S.match;
  if(!m || m.context!=='online' || !m.code) return;
  let r = null;
  if(ONLINE){ const {data} = await sb.from('rooms').select('state,status').eq('code', m.code).maybeSingle(); r = data; }
  else { r = rooms()[m.code]; }
  if(!r || !r.state) return;
  if((r.state.rev||0) > (m.rev||0)){
    const wasWinner = m.winner;
    S.match = r.state; S.match.code = m.code;
    if(S.match.winner && !wasWinner){ stopSync(); saveHistory(S.match); S.detecting=false; return go('end'); }
    render();
    maybeBot();
  }
}
function startSync(){
  stopSync();
  if(!S.match || S.match.context!=='online') return;
  syncTimer = setInterval(pullMatch, 1600);
}
function stopSync(){ if(syncTimer){ clearInterval(syncTimer); syncTimer=null; } }

  slot.querySelectorAll('[data-fn]').forEach(b=>b.onclick=()=>{ S.pick.num=+b.dataset.fn; renderConfirm(); });

  if(!S.detecting){
    h.innerHTML = `Cible dégagée ? <a id="hint-base">Lancer le comptage</a>`;
    const a = document.getElementById('hint-base'); if(a) a.onclick = ()=>{ captureBaseline(); };
    return;
  }
  const m = S.match;
  if(m && cur().isBot){ h.textContent = "L'ordinateur joue, la détection reprend à ton tour."; return; }
  const st = S.detStatus;
  if(st==='mouvement') h.textContent = "Ça bouge devant la cible, la lecture reprend dès que c'est stable.";
  else if(st==='cible masquée') h.textContent = "Cible masquée, écarte-toi du champ de la caméra.";
  else if(st==='fléchette repérée') h.textContent = "Fléchette repérée…";
  else if(st==='trop petit') h.textContent = "Changement trop petit pour être une fléchette. Rapproche la caméra de la cible.";
  else h.textContent = "Comptage en route. Touche la cible sur l'image pour corriger un point.";
}
function camTargetLabel(m){
  const p = cur();
  if(m.mode==='x01'){ const co = checkout(p.score, m.conf.doubleOut); return co? 'sortie '+co : 'reste '+p.score; }
  if(m.mode==='cricket'){ const o = CRICKET_TARGETS.filter(t=>p.marks[t]<3); return o.length? 'à fermer '+o.slice(0,3).map(t=>t===25?'bull':t).join(' ') : 'marquer les points'; }
  if(m.mode==='clock') return 'cible '+(p.target>20?'bull':p.target);
  if(m.mode==='shanghai') return 'cible '+(m.round+1);
  if(m.mode==='topscore') return 'volée '+(Math.floor(p.darts/3)+1)+'/'+m.conf.turns;
  return '';
}

function rankPlayers(m){
  const ps = m.players.slice();
  if(m.mode==='x01') return ps.sort((a,b)=> b.legs-a.legs || a.score-b.score);
  if(m.mode==='clock') return ps.sort((a,b)=> b.target-a.target);
  return ps.sort((a,b)=> b.points-a.points);
}
function resultValue(m,p){
  if(m.mode==='x01') return p.legs+' · reste '+p.score;
  if(m.mode==='clock') return p.target>21? 'terminé' : 'cible '+Math.min(p.target,21);
  if(m.mode==='cricket') return p.points+' pts';
  return p.points+' pts';
}

/* ---------- feed ---------- */
function feed(){ return ONLINE ? (S.cache.feed||[]) : load(K.feed, []); }

async function loadFeed(){
  if(!ONLINE) return;
  const {data:posts, error} = await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(60);
  if(error || !posts){ S.cache.feedLoaded = true; return; }
  const ids = posts.map(p=>p.id);
  const authorIds = [...new Set(posts.map(p=>p.user_id))];
  const [{data:authors}, {data:likes}, {data:comments}] = await Promise.all([
    sb.from('profiles').select('*').in('id', authorIds.length?authorIds:['00000000-0000-0000-0000-000000000000']),
    ids.length? sb.from('likes').select('*').in('post_id', ids) : Promise.resolve({data:[]}),
    ids.length? sb.from('comments').select('*').in('post_id', ids).order('created_at') : Promise.resolve({data:[]})
  ]);
  cacheProfiles(authors);
  const commenterIds = [...new Set((comments||[]).map(c=>c.user_id))].filter(id=>!S.cache.profiles[id]);
  if(commenterIds.length){
    const {data:more} = await sb.from('profiles').select('*').in('id', commenterIds);
    cacheProfiles(more);
  }
  S.cache.feed = posts.map(p=>({
    id:p.id, uid:p.user_id, at:new Date(p.created_at).getTime(), text:p.text||'',
    mode:p.mode, subtitle:p.subtitle||'', lines:p.lines||[], chips:p.chips||[],
    likes:(likes||[]).filter(l=>l.post_id===p.id).map(l=>l.user_id),
    comments:(comments||[]).filter(c=>c.post_id===p.id).map(c=>({
      uid:c.user_id, name:(S.cache.profiles[c.user_id]||{}).name||'Joueur', text:c.text, at:new Date(c.created_at).getTime()
    }))
  }));
  S.cache.feedLoaded = true;
}

async function loadFriends(){
  if(!ONLINE || !ME) return;
  const {data:links} = await sb.from('friends').select('friend_id').eq('user_id', ME.id);
  const ids = (links||[]).map(l=>l.friend_id);
  if(!ids.length){ S.cache.friends = []; S.cache.friendsLoaded = true; return; }
  const {data:profs} = await sb.from('profiles').select('*').in('id', ids);
  cacheProfiles(profs);
  S.cache.friends = profs||[];
  S.cache.friendsLoaded = true;
}

async function publishMatch(m, text){
  const u = me();
  const ranked = rankPlayers(m);
  const mine = m.players.find(p=>p.uid===u.id);
  const post = {
    id: uid(), uid:u.id, at: now(), text: (text||'').trim(),
    mode: m.mode,
    subtitle: m.mode==='x01'? m.conf.start+' · '+(m.conf.doubleOut?'double out':'sortie libre') : MODES[m.mode].desc.split(',')[0],
    lines: ranked.map(p=>({name:p.name, val:resultValue(m,p), win:p.id===m.winner})),
    chips: mine? [
      'moy '+(mine.darts? (mine.totalScored/mine.darts*3).toFixed(1):'0'),
      'meilleure volée '+mine.best,
      mine.count180? mine.count180+' × 180' : null,
      m.winner===mine.id? 'victoire' : null
    ].filter(Boolean) : [],
    likes:[], comments:[]
  };
  if(ONLINE){
    const {error} = await sb.from('posts').insert({
      user_id:u.id, text:post.text, mode:post.mode, subtitle:post.subtitle,
      lines:post.lines, chips:post.chips
    });
    if(error) throw error;
    await loadFeed();
    return;
  }
  const f = load(K.feed,[]); f.unshift(post); save(K.feed, f.slice(0,300));
}
function friendsOf(u){
  if(ONLINE) return S.cache.friends||[];
  return (u&&u.friends||[]).map(userById).filter(Boolean);
}
async function addFriendByName(name){
  if(ONLINE){
    const {data:t} = await sb.from('profiles').select('*').ilike('name', name).maybeSingle();
    if(!t) return {err:'Aucun joueur ne porte ce pseudo.'};
    if(t.id===ME.id) return {err:"Difficile de s'ajouter soi-même."};
    if((S.cache.friends||[]).some(f=>f.id===t.id)) return {err:t.name+' fait déjà partie de tes amis.'};
    const {error} = await sb.from('friends').insert({user_id:ME.id, friend_id:t.id});
    if(error) return {err:"L'ajout a échoué. Réessaie."};
    await loadFriends();
    return {ok:t.name+' a été ajouté à tes amis.'};
  }
  const u = me();
  const t = load(K.users,[]).find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!t) return {err:'Aucun joueur ne porte ce pseudo.'};
  if(t.id===u.id) return {err:"Difficile de s'ajouter soi-même."};
  if((u.friends||[]).includes(t.id)) return {err:t.name+' fait déjà partie de tes amis.'};
  await saveMe({friends:[...(u.friends||[]), t.id]});
  return {ok:t.name+' a été ajouté à tes amis.'};
}
async function removeFriend(id){
  if(ONLINE){
    await sb.from('friends').delete().eq('user_id', ME.id).eq('friend_id', id);
    await loadFriends();
    return;
  }
  await saveMe({friends:(me().friends||[]).filter(x=>x!==id)});
}

async function toggleLike(id){
  const p = feed().find(x=>x.id===id); if(!p) return;
  const meId = (me()||{}).id;
  const liked = (p.likes||[]).includes(meId);
  // retour visuel immédiat, puis écriture
  p.likes = liked ? p.likes.filter(x=>x!==meId) : [...(p.likes||[]), meId];
  render();
  if(ONLINE){
    if(liked) await sb.from('likes').delete().eq('post_id', id).eq('user_id', meId);
    else await sb.from('likes').insert({post_id:id, user_id:meId});
    return;
  }
  const f = load(K.feed,[]); const lp = f.find(x=>x.id===id);
  if(lp){ lp.likes = p.likes; save(K.feed,f); }
}
async function addComment(id, text){
  const p = feed().find(x=>x.id===id); if(!p) return;
  const u = me();
  p.comments.push({uid:u.id, name:u.name, text, at:now()});
  render();
  if(ONLINE){
    await sb.from('comments').insert({post_id:id, user_id:u.id, text});
    return;
  }
  const f = load(K.feed,[]); const lp = f.find(x=>x.id===id);
  if(lp){ lp.comments = p.comments; save(K.feed,f); }
}

    S.msg=null; S.err=null; render();
  });

};

/* =========================================================
   RENDER
========================================================= */
function render(){
  const app = document.getElementById('app');
  const navEl = document.getElementById('nav');
  if(S.view!=='auth' && !me()) S.view='auth';
  const view = V[S.view] || V.home;
  app.innerHTML = '';
  try{
    app.appendChild(view());
  }catch(err){
    console.error('rendu', S.view, err);
    app.appendChild(el(`<div class="stack" style="gap:14px;">
      <p class="err">Cet écran n'a pas pu s'afficher. Retour à l'accueil.</p>
      <button class="btn btn-p wide" id="crash-home">Revenir à l'accueil</button>
    </div>`));
    const b = document.getElementById('crash-home');
    if(b) b.onclick = ()=>{ S.err=null; S.match=null; S.room=null; S.friendStep='choice'; go('home'); };
  }

  paintNavLogo();
  const showNav = ['home','feed','profile'].includes(S.view);
  const tz = document.getElementById('toasts');
  if(tz) tz.style.bottom = showNav ? 'calc(78px + env(safe-area-inset-bottom))' : 'calc(20px + env(safe-area-inset-bottom))';
  navEl.classList.toggle('hidden', !showNav);
  app.classList.toggle('pad-nav', showNav);
  navEl.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on', b.dataset.nav===S.view));

  if(S.view==='play'){
    if(S.fullCam){
      renderFullCam();
    } else {
      const cf = document.getElementById('camfull'); if(cf) cf.remove();
      mountCamera();
      if(camNode) camNode.classList.add('big');
      renderConfirm();
    }
    renderCamHint();
    renderCamScore();
    applyZoom();
    keepAwake(true);
    turnFlash();
  } else {
    const cf = document.getElementById('camfull'); if(cf) cf.remove();
    keepAwake(false);
  }
  if(S.view!==lastView){ window.scrollTo({top:0}); lastView = S.view; }
}
let lastView = null;
function paintNavLogo(){
  const l = document.getElementById('nav-logo');
  if(l && !l.src.startsWith('data:')) l.src = LOGO_ICON;
}
function mountCamera(){
  const slot = document.getElementById('cam-slot');
  if(!slot) return;
  slot.appendChild(ensureCamNode());
  if(S.camOn && video && !video.srcObject) S.camOn = false;
  setTimeout(()=>{ resizeOverlay(); drawOverlay(); }, 50);
  if(S.detecting) loopDetect();
}
function setupCanvas(){
  video = document.getElementById('video');
  ovC = document.getElementById('ov');
  if(!video || !ovC) return;
  ovX = ovC.getContext('2d');
  if(!wkC){ wkC = document.createElement('canvas'); wkX = wkC.getContext('2d'); }
  const resize = ()=>{
    const r = video.getBoundingClientRect();
    if(!r.width) return;
    ovC.width = r.width; ovC.height = r.height;
    drawOverlay();
  };
  video.addEventListener('loadedmetadata', resize);
  window.addEventListener('resize', resize);
  setTimeout(resize, 200);
  ovC.addEventListener('click', onBoardTap);
  ovC.addEventListener('touchstart', e=>{ e.preventDefault(); onBoardTap(e); }, {passive:false});
  if(S.camOn && !video.srcObject) S.camOn = false;
}

document.getElementById('nav').querySelectorAll('[data-nav]').forEach(b=>{
  b.onclick = ()=>go(b.dataset.nav);
});

async function boot(){
  S.zoom = load(K.zoom, 1);
  S.view = 'auth';
  render();
  await connectSupabase();
  if(ONLINE){
    await handleAuthReturn();
    try{
      const {data} = await sb.auth.getSession();
      if(data && data.session) await adoptSession(data.session.user);
    }catch(e){}
    sb.auth.onAuthStateChange(async (evt, session)=>{
      if(evt==='SIGNED_OUT'){ ME=null; if(S.view!=='auth') go('auth'); }
    });
  }
  S.view = me()? 'home' : 'auth';
  render();
  if(ONLINE && ME) refreshCaches();
}
boot();
</script>
